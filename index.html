```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真確認・ルーム作成</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81,
      #581c87
    );

  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 24px;
  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);
}

h1 {
  text-align: center;
  margin-top: 0;
}

h2 {
  margin-top: 28px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.roomBox {
  margin-top: 20px;
  padding: 18px;
  background: #f3f4f6;
  border-radius: 16px;
}

.roomCode {
  margin-top: 10px;
  padding: 15px;
  background: white;
  border-radius: 12px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 3px;
}

.linkBox {
  margin-top: 12px;
  padding: 12px;
  background: white;
  border-radius: 12px;
  word-break: break-all;
  font-size: 13px;
}

.photoCard {
  margin-top: 15px;
  padding: 15px;
  background: #f5f5f7;
  border-radius: 15px;
}

.photoCard img {
  display: block;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 12px;
  background: #111;
}

.photoInfo {
  font-size: 14px;
  line-height: 1.6;
}

.empty {
  padding: 20px;
  text-align: center;
  color: #777;
  background: #f3f4f6;
  border-radius: 12px;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  background: #f3f4f6;
  white-space: pre-wrap;
  word-break: break-word;
}

.rankingCard {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding: 13px;
  background: #f5f5f7;
  border-radius: 12px;
}

.rankingNumber {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #111827;
  color: white;
  font-weight: bold;
}

.rankingInfo {
  flex: 1;
}

.rankingScore {
  font-size: 20px;
  font-weight: bold;
  color: #4f46e5;
}

.small {
  color: #777;
  font-size: 12px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 写真確認・ルーム作成</h1>

<p>
AI顔診断用のルームを作成できます。
</p>


<!-- =========================
     ルーム作成
========================= -->

<div class="roomBox">

<h2>🔗 ルームを作成</h2>

<p>
ルームを作成すると、専用のAI顔診断リンクが発行されます。
</p>

<button
  id="createRoomButton"
  type="button"
>
ルームを作成する
</button>

<div
  id="roomResult"
  class="hidden"
>

<div class="small">
ルームID
</div>

<div
  id="roomCode"
  class="roomCode"
></div>

<div class="small" style="margin-top:15px;">
AI顔診断リンク
</div>

<div
  id="diagnosisLink"
  class="linkBox"
></div>

<button
  id="copyLinkButton"
  type="button"
>
📋 診断リンクをコピー
</button>

<button
  id="openDiagnosisButton"
  type="button"
>
🚀 AI顔診断を開く
</button>

</div>

</div>


<!-- =========================
     ルーム写真
========================= -->

<div id="roomViewer">

<h2>📸 ルームの写真</h2>

<div
  id="roomStatus"
  class="status"
>
ルームが選択されていません。
</div>

<div
  id="photoList"
></div>

<button
  id="refreshButton"
  type="button"
>
🔄 写真を更新
</button>

</div>


<!-- =========================
     ランキング
========================= -->

<div>

<h2>🏆 総合ランキング</h2>

<div
  id="rankingStatus"
  class="status"
>
ランキングを読み込んでいます…
</div>

<div
  id="rankingList"
></div>

</div>

</div>


<script>

/* =========================================
   Supabase Edge Function
========================================= */

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


/* =========================================
   AI診断サイト
   ※ここが重要
========================================= */

const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


/* =========================================
   HTML要素
========================================= */

const createRoomButton =
  document.getElementById(
    "createRoomButton"
  );

const roomResult =
  document.getElementById(
    "roomResult"
  );

const roomCode =
  document.getElementById(
    "roomCode"
  );

const diagnosisLink =
  document.getElementById(
    "diagnosisLink"
  );

const copyLinkButton =
  document.getElementById(
    "copyLinkButton"
  );

const openDiagnosisButton =
  document.getElementById(
    "openDiagnosisButton"
  );

const roomStatus =
  document.getElementById(
    "roomStatus"
  );

const photoList =
  document.getElementById(
    "photoList"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );

const rankingStatus =
  document.getElementById(
    "rankingStatus"
  );

const rankingList =
  document.getElementById(
    "rankingList"
  );


/* =========================================
   現在のルーム
========================================= */

let currentRoom =
  "";


/* =========================================
   ランダムなルームID
========================================= */

function generateRoomId() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/* =========================================
   診断リンク作成
========================================= */

function createDiagnosisLink(
  room
) {

  return (
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      room
    )
  );

}


/* =========================================
   ルーム作成
========================================= */

createRoomButton.addEventListener(
  "click",
  () => {

    currentRoom =
      generateRoomId();

    const link =
      createDiagnosisLink(
        currentRoom
      );


    roomCode.textContent =
      currentRoom;


    diagnosisLink.textContent =
      link;


    roomResult.classList.remove(
      "hidden"
    );


    roomStatus.textContent =
      "ルーム「" +
      currentRoom +
      "」を表示しています。";


    loadPhotos();

  }
);


/* =========================================
   リンクコピー
========================================= */

copyLinkButton.addEventListener(
  "click",
  async () => {

    const link =
      diagnosisLink.textContent;


    if (!link) {

      alert(
        "先にルームを作成してください。"
      );

      return;

    }


    try {

      await navigator.clipboard.writeText(
        link
      );

      alert(
        "診断リンクをコピーしました！"
      );

    } catch (error) {

      /*
        clipboardが使えない環境用
      */

      prompt(
        "このリンクをコピーしてください。",
        link
      );

    }

  }
);


/* =========================================
   AI診断を開く
========================================= */

openDiagnosisButton.addEventListener(
  "click",
  () => {

    if (!currentRoom) {

      alert(
        "先にルームを作成してください。"
      );

      return;

    }


    const link =
      createDiagnosisLink(
        currentRoom
      );


    window.open(
      link,
      "_blank"
    );

  }
);


/* =========================================
   URLのroomを取得
========================================= */

function getRoomFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get("room") ||
    ""
  );

}


/* =========================================
   写真読み込み
========================================= */

async function loadPhotos() {

  if (!currentRoom) {

    photoList.innerHTML = "";

    roomStatus.textContent =
      "ルームが選択されていません。";

    return;

  }


  roomStatus.textContent =
    "📷 写真を読み込んでいます…";


  photoList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        PHOTO_RECEIVER_URL +
        "?room=" +
        encodeURIComponent(
          currentRoom
        )
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "写真の取得に失敗しました。"
      );

    }


    const photos =
      Array.isArray(
        data.photos
      )
        ? data.photos
        : [];


    if (
      photos.length === 0
    ) {

      roomStatus.textContent =
        "このルームにはまだ写真がありません。";

      return;

    }


    roomStatus.textContent =
      "📸 " +
      photos.length +
      "枚の写真があります。";


    photos.forEach(
      (item) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "photoCard";


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "photoInfo";


        const nickname =
          item.nickname ||
          "名前なし";


        const ageText =
          item.age !== null &&
          item.age !== undefined
            ? " / " +
              item.age +
              "歳"
            : "";


        info.innerHTML =
          "<strong>👤 " +
          escapeHtml(
            nickname
          ) +
          "</strong>" +
          ageText +
          "<br>" +
          "<span class='small'>" +
          escapeHtml(
            item.file_name ||
            ""
          ) +
          "</span>";


        card.appendChild(
          info
        );


        if (
          item.signed_url
        ) {

          const image =
            document.createElement(
              "img"
            );


          image.src =
            item.signed_url;


          image.alt =
            "受信した写真";


          image.loading =
            "lazy";


          image.style.cursor =
            "pointer";


          image.addEventListener(
            "click",
            () => {

              window.open(
                item.signed_url,
                "_blank"
              );

            }
          );


          card.appendChild(
            image
          );

        }


        photoList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    roomStatus.textContent =
      "写真の読み込みに失敗しました。\n" +
      error.message;

  }

}


/* =========================================
   ランキング
========================================= */

async function loadRanking() {

  rankingStatus.textContent =
    "🏆 ランキングを読み込んでいます…";


  rankingList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        PHOTO_RECEIVER_URL +
        "?ranking=true"
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ランキング取得に失敗しました。"
      );

    }


    const rankings =
      Array.isArray(
        data.rankings
      )
        ? data.rankings
        : [];


    if (
      rankings.length === 0
    ) {

      rankingStatus.textContent =
        "まだランキングデータがありません。";

      return;

    }


    rankingStatus.textContent =
      "現在のランキング";


    rankings.forEach(
      (item, index) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "rankingCard";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "rankingNumber";


        number.textContent =
          index + 1;


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "rankingInfo";


        const name =
          item.nickname ||
          "名前なし";


        const ageText =
          item.age !== null &&
          item.age !== undefined
            ? " / " +
              item.age +
              "歳"
            : "";


        info.innerHTML =
          "<strong>" +
          escapeHtml(
            name
          ) +
          "</strong>" +
          ageText +
          "<br>" +
          "<span class='small'>" +
          "ルーム: " +
          escapeHtml(
            item.room ||
            ""
          ) +
          "</span>";


        const score =
          document.createElement(
            "div"
          );


        score.className =
          "rankingScore";


        score.textContent =
          item.score +
          "点";


        card.appendChild(
          number
        );

        card.appendChild(
          info
        );

        card.appendChild(
          score
        );


        rankingList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    rankingStatus.textContent =
      "ランキングの読み込みに失敗しました。\n" +
      error.message;

  }

}


/* =========================================
   更新
========================================= */

refreshButton.addEventListener(
  "click",
  () => {

    loadPhotos();

    loadRanking();

  }
);


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   初期化
========================================= */

currentRoom =
  getRoomFromUrl();


if (currentRoom) {

  roomCode.textContent =
    currentRoom;


  diagnosisLink.textContent =
    createDiagnosisLink(
      currentRoom
    );


  roomResult.classList.remove(
    "hidden"
  );


  roomStatus.textContent =
    "ルーム「" +
    currentRoom +
    "」を表示しています。";


  loadPhotos();

}


loadRanking();

</script>

</body>
</html>
