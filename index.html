<script>


/* =================================
   Supabase Edge Function
================================= */


const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


/* =================================
   HTML
================================= */


const createRoomButton =
  document.getElementById(
    "createRoomButton"
  );


const roomCreated =
  document.getElementById(
    "roomCreated"
  );


const roomIdElement =
  document.getElementById(
    "roomId"
  );


const roomLinkElement =
  document.getElementById(
    "roomLink"
  );


const copyLinkButton =
  document.getElementById(
    "copyLinkButton"
  );


const openRoomButton =
  document.getElementById(
    "openRoomButton"
  );


const createStatus =
  document.getElementById(
    "createStatus"
  );


const roomSection =
  document.getElementById(
    "roomSection"
  );


const currentRoom =
  document.getElementById(
    "currentRoom"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const photoStatus =
  document.getElementById(
    "photoStatus"
  );


const photoGrid =
  document.getElementById(
    "photoGrid"
  );


const emptyPhotos =
  document.getElementById(
    "emptyPhotos"
  );


const rankingRefreshButton =
  document.getElementById(
    "rankingRefreshButton"
  );


const rankingStatus =
  document.getElementById(
    "rankingStatus"
  );


const rankingList =
  document.getElementById(
    "rankingList"
  );


const imageModal =
  document.getElementById(
    "imageModal"
  );


const modalImage =
  document.getElementById(
    "modalImage"
  );


const closeModalButton =
  document.getElementById(
    "closeModalButton"
  );


/* =================================
   現在のroom
================================= */


const params =
  new URLSearchParams(
    window.location.search
  );


let currentRoomId =
  params.get("room") || "";


/* =================================
   ステータス表示
================================= */


function showStatus(
  element,
  message,
  type = ""
) {

  element.textContent =
    message;

  element.className =
    "status";

  if (type) {

    element.classList.add(
      type
    );

  }

}


/* =================================
   Room ID生成
================================= */


function generateRoomId() {

  const characters =
    "abcdefghijklmnopqrstuvwxyz0123456789";


  let result =
    "";


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    result +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }


  return result;

}


/* =================================
   ルームリンク
================================= */


function getRoomLink(
  room
) {

  return (
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      room
    )
  );

}


/* =================================
   ルーム作成
================================= */


createRoomButton.addEventListener(
  "click",
  () => {

    currentRoomId =
      generateRoomId();


    const link =
      getRoomLink(
        currentRoomId
      );


    roomIdElement.textContent =
      currentRoomId;


    roomLinkElement.textContent =
      link;


    roomCreated.classList.remove(
      "hidden"
    );


    showStatus(
      createStatus,
      "ルームを作成しました。",
      "success"
    );

  }
);


/* =================================
   コピー
================================= */


copyLinkButton.addEventListener(
  "click",
  async () => {

    const link =
      roomLinkElement.textContent;


    try {

      await navigator.clipboard.writeText(
        link
      );


      showStatus(
        createStatus,
        "リンクをコピーしました。",
        "success"
      );


    } catch (error) {

      /*
        clipboardが使えない場合
      */

      window.prompt(
        "このリンクをコピーしてください。",
        link
      );

    }

  }
);


/* =================================
   ルームを見る
================================= */


openRoomButton.addEventListener(
  "click",
  () => {

    if (!currentRoomId) {
      return;
    }


    const link =
      getRoomLink(
        currentRoomId
      );


    window.location.href =
      link;

  }
);


/* =================================
   写真取得
================================= */


async function loadPhotos() {

  if (!currentRoomId) {

    return;

  }


  showStatus(
    photoStatus,
    "📷 写真を読み込んでいます…"
  );


  photoGrid.innerHTML =
    "";


  emptyPhotos.classList.add(
    "hidden"
  );


  try {

    const url =
      PHOTO_RECEIVER_URL +
      "?room=" +
      encodeURIComponent(
        currentRoomId
      );


    const response =
      await fetch(
        url,
        {
          method:
            "GET"
        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        "サーバーからJSON形式のデータを取得できませんでした。\n" +
        text
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "写真の取得に失敗しました。"
      );

    }


    const photos =
      Array.isArray(
        data.photos
      )
        ? data.photos
        : [];


    if (
      photos.length === 0
    ) {

      showStatus(
        photoStatus,
        "このルームにはまだ写真がありません。"
      );


      emptyPhotos.classList.remove(
        "hidden"
      );


      return;

    }


    showStatus(
      photoStatus,
      photos.length +
      "枚の写真を受信しています。",
      "success"
    );


    photos.forEach(
      photoData => {

        createPhotoCard(
          photoData
        );

      }
    );


  } catch (error) {

    console.error(
      "写真取得エラー:",
      error
    );


    showStatus(
      photoStatus,
      "写真を取得できませんでした。\n\n" +
      error.message,
      "error"
    );

  }

}


/* =================================
   写真カード
================================= */


function createPhotoCard(
  photoData
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "photoCard";


  const image =
    document.createElement(
      "img"
    );


  image.src =
    photoData.photo_url;


  image.alt =
    photoData.nickname ||
    "受信した写真";


  image.addEventListener(
    "click",
    () => {

      modalImage.src =
        photoData.photo_url;

      imageModal.classList.add(
        "show"
      );

    }
  );


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "photoInfo";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "photoName";


  name.textContent =
    photoData.nickname ||
    "名無し";


  info.appendChild(
    name
  );


  if (
    photoData.age !==
    null &&
    photoData.age !==
    undefined
  ) {

    const age =
      document.createElement(
        "div"
      );


    age.textContent =
      "年齢：" +
      photoData.age;


    info.appendChild(
      age
    );

  }


  if (
    photoData.created_at
  ) {

    const date =
      document.createElement(
        "div"
      );


    date.textContent =
      new Date(
        photoData.created_at
      ).toLocaleString(
        "ja-JP"
      );


    info.appendChild(
      date
    );

  }


  card.appendChild(
    image
  );


  card.appendChild(
    info
  );


  photoGrid.appendChild(
    card
  );

}


/* =================================
   ランキング
================================= */


async function loadRanking() {

  showStatus(
    rankingStatus,
    "🏆 ランキングを読み込んでいます…"
  );


  rankingList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        PHOTO_RECEIVER_URL +
        "?ranking=true",
        {
          method:
            "GET"
        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        "ランキングデータを読み込めませんでした。\n" +
        text
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ランキング取得に失敗しました。"
      );

    }


    const rankings =
      Array.isArray(
        data.rankings
      )
        ? data.rankings
        : [];


    if (
      rankings.length === 0
    ) {

      showStatus(
        rankingStatus,
        "まだランキングデータがありません。"
      );

      return;

    }


    showStatus(
      rankingStatus,
      rankings.length +
      "件のランキングを表示しています。",
      "success"
    );


    rankings.forEach(
      (
        item,
        index
      ) => {

        createRankingItem(
          item,
          index + 1
        );

      }
    );


  } catch (error) {

    console.error(
      "ランキング取得エラー:",
      error
    );


    showStatus(
      rankingStatus,
      "ランキングを取得できませんでした。\n\n" +
      error.message,
      "error"
    );

  }

}


/* =================================
   ランキングカード
================================= */


function createRankingItem(
  item,
  position
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "rankItem";


  const number =
    document.createElement(
      "div"
    );


  number.className =
    "rankNumber";


  number.textContent =
    position + "位";


  const nameArea =
    document.createElement(
      "div"
    );


  nameArea.className =
    "rankName";


  const name =
    document.createElement(
      "div"
    );


  name.textContent =
    item.nickname ||
    "名無し";


  name.style.fontWeight =
    "bold";


  nameArea.appendChild(
    name
  );


  if (
    item.age !==
    null &&
    item.age !==
    undefined
  ) {

    const age =
      document.createElement(
        "div"
      );


    age.className =
      "rankAge";


    age.textContent =
      "年齢：" +
      item.age;


    nameArea.appendChild(
      age
    );

  }


  const score =
    document.createElement(
      "div"
    );


  score.className =
    "rankScore";


  score.textContent =
    item.score +
    "点";


  row.appendChild(
    number
  );


  row.appendChild(
    nameArea
  );


  row.appendChild(
    score
  );


  rankingList.appendChild(
    row
  );

}


/* =================================
   更新
================================= */


refreshButton.addEventListener(
  "click",
  () => {

    loadPhotos();

  }
);


rankingRefreshButton.addEventListener(
  "click",
  () => {

    loadRanking();

  }
);


/* =================================
   モーダル
================================= */


closeModalButton.addEventListener(
  "click",
  () => {

    imageModal.classList.remove(
      "show"
    );


    modalImage.src =
      "";

  }
);


imageModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      imageModal
    ) {

      imageModal.classList.remove(
        "show"
      );

      modalImage.src =
        "";

    }

  }
);


/* =================================
   初期化
================================= */


if (
  currentRoomId
) {

  /*
    room付きリンクの場合
    そのルームを表示
  */

  roomSection.classList.remove(
    "hidden"
  );


  currentRoom.textContent =
    currentRoomId;


  loadPhotos();

}


/*
  ランキングは常に表示
*/

loadRanking();


</script>

</body>
</html>
```
