
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AI顔診断 写真管理</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81,
      #581c87
    );
  color: #222;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  background: white;
  padding: 24px;
  border-radius: 24px;
  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);
}

h1 {
  margin-top: 0;
  text-align: center;
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.createArea {
  text-align: center;
}

.roomInfo {
  display: none;
  margin-top: 20px;
}

.infoBox {
  margin-top: 15px;
  padding: 15px;
  background: #f3f4f6;
  border-radius: 14px;
  text-align: left;
}

.infoTitle {
  font-weight: bold;
  margin-bottom: 8px;
}

.roomId {
  padding: 12px;
  background: white;
  border-radius: 10px;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
  text-align: center;
  word-break: break-all;
}

.linkBox {
  padding: 12px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 13px;
  word-break: break-all;
  line-height: 1.5;
}

.copyButton {
  background: #4f46e5;
}

.openButton {
  background: #16a34a;
}

.managementBox {
  margin-top: 15px;
  padding: 15px;
  background: #fff7ed;
  border: 2px solid #fed7aa;
  border-radius: 14px;
}

.managementTitle {
  font-weight: bold;
  font-size: 17px;
  margin-bottom: 8px;
}

.status {
  margin-top: 15px;
  padding: 12px;
  background: #f3f4f6;
  border-radius: 10px;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.photoCard {
  margin-top: 15px;
  padding: 15px;
  background: #f5f5f7;
  border-radius: 15px;
}

.photoCard img {
  display: block;
  width: 100%;
  border-radius: 12px;
  margin-bottom: 10px;
}

.photoInfo {
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}

.deleteButton {
  background: #dc2626;
}

.refreshButton {
  background: #374151;
}

.rankingCard {
  margin-top: 12px;
  padding: 14px;
  background: #f5f5f7;
  border-radius: 12px;
}

.rankingNumber {
  font-size: 20px;
  font-weight: bold;
}

.hidden {
  display: none;
}

.message {
  margin-top: 15px;
  padding: 12px;
  background: #dcfce7;
  color: #166534;
  border-radius: 10px;
  white-space: pre-wrap;
}

.warning {
  margin-top: 15px;
  padding: 12px;
  background: #fef3c7;
  color: #92400e;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
}

.section {
  margin-top: 30px;
}

hr {
  margin: 30px 0;
  border: 0;
  border-top: 1px solid #ddd;
}

</style>

</head>


<body>

<div class="container">

<h1>
📸 AI顔診断 写真管理
</h1>


<!-- =========================
     ルーム作成
========================= -->

<div
  id="createArea"
  class="createArea"
>

<h2>
🔗 ルームを作成
</h2>

<p>
ルームを作成すると、
専用のAI顔診断リンクが発行されます。
</p>

<button
  id="createRoomButton"
  type="button"
>
ルームを作成する
</button>

</div>


<!-- =========================
     ルーム情報
========================= -->

<div
  id="roomInfo"
  class="roomInfo"
>

<h2>
🔗 ルーム情報
</h2>


<div class="infoBox">

<div class="infoTitle">
ルームID
</div>

<div
  id="roomText"
  class="roomId"
>
-
</div>

</div>


<!-- AI顔診断リンク -->

<div class="infoBox">

<div class="infoTitle">
AI顔診断リンク
</div>

<div
  id="diagnosisLink"
  class="linkBox"
>
-
</div>

<button
  id="copyDiagnosisButton"
  class="copyButton"
  type="button"
>
📋 診断リンクをコピー
</button>

<button
  id="openDiagnosisButton"
  class="openButton"
  type="button"
>
🚀 AI顔診断を開く
</button>

</div>


<!-- 管理用リンク -->

<div
  id="managementBox"
  class="managementBox"
>

<div class="managementTitle">
🔐 管理用リンク
</div>

<p>
このリンクから、このルームの写真管理・削除ができます。
</p>

<div
  id="managementLink"
  class="linkBox"
>
管理用リンクを作成しています…
</div>

<button
  id="copyManagementButton"
  class="copyButton"
  type="button"
>
📋 管理用リンクをコピー
</button>

<button
  id="openManagementButton"
  class="openButton"
  type="button"
>
🔐 管理画面を開く
</button>

<div class="warning">

⚠️ 管理用リンクには管理権限が含まれます。
他の人に見せたり、SNSなどに公開しないでください。

</div>

</div>


<div
  id="roomMessage"
  class="message hidden"
></div>

</div>


<!-- =========================
     写真一覧
========================= -->

<div
  id="roomViewer"
  class="section"
>

<h2>
📸 ルームの写真
</h2>

<div
  id="roomStatus"
  class="status"
>
ルームが選択されていません。
</div>

<div
  id="photoList"
></div>

<button
  id="refreshButton"
  class="refreshButton"
  type="button"
>
🔄 写真を更新
</button>

</div>


<hr>


<!-- =========================
     ランキング
========================= -->

<div class="section">

<h2>
🏆 総合ランキング
</h2>

<div
  id="rankingStatus"
  class="status"
>
ランキングを読み込んでいます…
</div>

<div
  id="rankingList"
></div>

</div>

</div>


<script>

/* =========================
   API
========================= */

const API =
"https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const DIAGNOSIS_URL =
"https://gaffney16445.github.io/ai-face-diagnosis/";


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  window.location.search
);


let room =
params.get("room") || "";


let ownerToken =
params.get("token") || "";


/* =========================
   HTML要素
========================= */

const createArea =
document.getElementById(
  "createArea"
);

const createRoomButton =
document.getElementById(
  "createRoomButton"
);

const roomInfo =
document.getElementById(
  "roomInfo"
);

const roomText =
document.getElementById(
  "roomText"
);

const diagnosisLink =
document.getElementById(
  "diagnosisLink"
);

const managementLink =
document.getElementById(
  "managementLink"
);

const copyDiagnosisButton =
document.getElementById(
  "copyDiagnosisButton"
);

const openDiagnosisButton =
document.getElementById(
  "openDiagnosisButton"
);

const copyManagementButton =
document.getElementById(
  "copyManagementButton"
);

const openManagementButton =
document.getElementById(
  "openManagementButton"
);

const roomMessage =
document.getElementById(
  "roomMessage"
);

const roomStatus =
document.getElementById(
  "roomStatus"
);

const photoList =
document.getElementById(
  "photoList"
);

const refreshButton =
document.getElementById(
  "refreshButton"
);

const rankingStatus =
document.getElementById(
  "rankingStatus"
);

const rankingList =
document.getElementById(
  "rankingList"
);


/* =========================
   URL作成
========================= */

function getDiagnosisUrl() {

  if (!room) {
    return "";
  }

  return (
    DIAGNOSIS_URL +
    "?room=" +
    encodeURIComponent(room)
  );

}


function getManagementUrl() {

  if (
    !room ||
    !ownerToken
  ) {
    return "";
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(room) +
    "&token=" +
    encodeURIComponent(ownerToken)
  );

}


/* =========================
   メッセージ
========================= */

function showMessage(
  text
) {

  roomMessage.textContent =
    text;

  roomMessage.classList.remove(
    "hidden"
  );

}


/* =========================
   コピー
========================= */

async function copyText(
  text
) {

  if (!text) {

    alert(
      "コピーするリンクがありません。"
    );

    return;

  }

  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "コピーしました！"
    );

  } catch (error) {

    /*
      Clipboard APIが使えない場合
    */

    window.prompt(
      "下のリンクをコピーしてください。",
      text
    );

  }

}


/* =========================
   ルーム表示
========================= */

function displayRoom() {

  if (!room) {
    return;
  }


  const diagnosisUrl =
    getDiagnosisUrl();


  const managementUrl =
    getManagementUrl();


  roomText.textContent =
    room;


  diagnosisLink.textContent =
    diagnosisUrl;


  /*
    管理用リンク
  */

  if (managementUrl) {

    managementLink.textContent =
      managementUrl;

    copyManagementButton.disabled =
      false;

    openManagementButton.disabled =
      false;

  } else {

    managementLink.textContent =
      "管理権限がありません。";

    copyManagementButton.disabled =
      true;

    openManagementButton.disabled =
      true;

  }


  roomInfo.style.display =
    "block";


  createArea.style.display =
    "none";


  /*
    重要：
    roomとtokenをURLに残す
  */

  if (
    room &&
    ownerToken
  ) {

    const newUrl =
      getManagementUrl();

    history.replaceState(
      null,
      "",
      newUrl
    );

  }

}


/* =========================
   ルーム作成
========================= */

createRoomButton.addEventListener(
  "click",
  async () => {

    createRoomButton.disabled =
      true;

    createRoomButton.textContent =
      "ルーム作成中…";


    try {

      const response =
        await fetch(
          API +
          "?action=create-room",
          {
            method: "POST"
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "ルーム作成に失敗しました。"
        );

      }


      /*
        APIから取得
      */

      room =
        data.room;

      ownerToken =
        data.owner_token;


      /*
        画面に表示
      */

      displayRoom();


      showMessage(
        "ルームを作成しました。"
      );


      /*
        写真一覧
      */

      await loadPhotos();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "ルーム作成に失敗しました。\n\n" +
        error.message
      );


      createRoomButton.disabled =
        false;

      createRoomButton.textContent =
        "ルームを作成する";

    }

  }
);


/* =========================
   診断リンクコピー
========================= */

copyDiagnosisButton.addEventListener(
  "click",
  () => {

    copyText(
      getDiagnosisUrl()
    );

  }
);


/* =========================
   診断リンクを開く
========================= */

openDiagnosisButton.addEventListener(
  "click",
  () => {

    const url =
      getDiagnosisUrl();

    if (!url) {
      return;
    }

    window.open(
      url,
      "_blank"
    );

  }
);


/* =========================
   管理リンクコピー
========================= */

copyManagementButton.addEventListener(
  "click",
  () => {

    copyText(
      getManagementUrl()
    );

  }
);


/* =========================
   管理画面を開く
========================= */

openManagementButton.addEventListener(
  "click",
  () => {

    const url =
      getManagementUrl();

    if (!url) {
      return;
    }

    window.open(
      url,
      "_blank"
    );

  }
);


/* =========================
   写真読み込み
========================= */

async function loadPhotos() {

  if (!room) {

    roomStatus.textContent =
      "ルームが選択されていません。";

    return;

  }


  roomStatus.textContent =
    "写真を読み込んでいます…";


  photoList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        API +
        "?room=" +
        encodeURIComponent(
          room
        )
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "写真の取得に失敗しました。"
      );

    }


    const photos =
      data.photos ||
      [];


    if (
      photos.length === 0
    ) {

      roomStatus.textContent =
        "まだ写真がありません。";

      return;

    }


    roomStatus.textContent =
      photos.length +
      "枚の写真があります。";


    photos.forEach(
      photoData => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "photoCard";


        const image =
          document.createElement(
            "img"
          );


        image.src =
          photoData.url;

        image.alt =
          "送信された写真";


        card.appendChild(
          image
        );


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "photoInfo";


        const nickname =
          photoData.nickname ||
          "名前なし";


        info.innerHTML =
          "<strong>名前：</strong>" +
          escapeHtml(
            nickname
          );


        if (
          photoData.age !==
          null &&
          photoData.age !==
          undefined
        ) {

          info.innerHTML +=
            "<br><strong>年齢：</strong>" +
            escapeHtml(
              String(
                photoData.age
              )
            );

        }


        if (
          photoData.created_at
        ) {

          info.innerHTML +=
            "<br><strong>撮影日時：</strong>" +
            escapeHtml(
              formatDate(
                photoData.created_at
              )
            );

        }


        card.appendChild(
          info
        );


        /*
          管理トークンがある場合だけ
          削除ボタンを表示
        */

        if (ownerToken) {

          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "deleteButton";


          deleteButton.type =
            "button";


          deleteButton.textContent =
            "🗑 この写真を削除";


          deleteButton.addEventListener(
            "click",
            () => {

              deletePhoto(
                photoData.file_name
              );

            }
          );


          card.appendChild(
            deleteButton
          );

        }


        photoList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    roomStatus.textContent =
      "写真の読み込みに失敗しました。\n\n" +
      error.message;

  }

}


/* =========================
   写真削除
========================= */

async function deletePhoto(
  fileName
) {

  if (!ownerToken) {

    alert(
      "管理権限がありません。"
    );

    return;

  }


  const ok =
    confirm(
      "この写真を削除しますか？"
    );


  if (!ok) {
    return;
  }


  try {

    const response =
      await fetch(
        API +
        "?action=delete-photo" +
        "&room=" +
        encodeURIComponent(
          room
        ) +
        "&token=" +
        encodeURIComponent(
          ownerToken
        ) +
        "&file_name=" +
        encodeURIComponent(
          fileName
        ),
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "削除に失敗しました。"
      );

    }


    alert(
      "写真を削除しました。"
    );


    await loadPhotos();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "削除に失敗しました。\n\n" +
      error.message
    );

  }

}


/* =========================
   写真更新
========================= */

refreshButton.addEventListener(
  "click",
  () => {

    loadPhotos();

  }
);


/* =========================
   ランキング
========================= */

async function loadRanking() {

  rankingStatus.textContent =
    "ランキングを読み込んでいます…";


  rankingList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        API +
        "?ranking=true"
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ランキングの取得に失敗しました。"
      );

    }


    const rankings =
      data.rankings ||
      [];


    if (
      rankings.length === 0
    ) {

      rankingStatus.textContent =
        "まだランキングデータがありません。";

      return;

    }


    rankingStatus.textContent =
      rankings.length +
      "件のランキングがあります。";


    rankings.forEach(
      (item, index) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "rankingCard";


        const nickname =
          item.nickname ||
          "匿名";


        card.innerHTML =
          "<div class='rankingNumber'>" +
          (index + 1) +
          "位　" +
          escapeHtml(
            nickname
          ) +
          "</div>" +

          "<div>" +
          "スコア：" +
          escapeHtml(
            String(
              item.score
            )
          ) +
          " / 100" +
          "</div>";


        if (
          item.age !==
          null &&
          item.age !==
          undefined
        ) {

          card.innerHTML +=
            "<div>" +
            "年齢：" +
            escapeHtml(
              String(
                item.age
              )
            ) +
            "</div>";

        }


        rankingList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    rankingStatus.textContent =
      "ランキングの読み込みに失敗しました。\n\n" +
      error.message;

  }

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   日付
========================= */

function formatDate(
  value
) {

  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(
    "ja-JP"
  );

}


/* =========================
   初期化
========================= */

async function initialize() {

  /*
    URLにroomがある場合
  */

  if (room) {

    displayRoom();

    await loadPhotos();

  }


  /*
    ランキング
  */

  await loadRanking();

}


initialize();

</script>

</body>
</html>
